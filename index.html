    // -----------------------------
    // 2. RAW MATERIALS VIEW
    // -----------------------------
    function RawMaterialsView({ rawMaterials, suppliers, onOpenModal, onDelete }) {
      const [search, setSearch] = useState('');
      const [filterCategory, setFilterCategory] = useState('ALL');
      const [filterSupplier, setFilterSupplier] = useState('ALL');

      const categories = useMemo(() => {
        const set = new Set(rawMaterials.map(r => r.category).filter(Boolean));
        return Array.from(set);
      }, [rawMaterials]);

      const filtered = useMemo(() => {
        return rawMaterials.filter(rm => {
          const matchSearch = rm.name.toLowerCase().includes(search.toLowerCase()) || 
                              rm.code.toLowerCase().includes(search.toLowerCase());
          const matchCat = filterCategory === 'ALL' || rm.category === filterCategory;
          const matchSupp = filterSupplier === 'ALL' || rm.supplierId === filterSupplier;
          return matchSearch && matchCat && matchSupp;
        });
      }, [rawMaterials, search, filterCategory, filterSupplier]);

      const totalRawValuation = useMemo(() => {
        return filtered.reduce((acc, rm) => acc + (rm.currentStock * rm.costPrice), 0);
      }, [filtered]);

      return (
        <div className="space-y-5 animate-fade-in">
          
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
            <div>
              <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                <i className="fas fa-wheat-awn text-emerald-600"></i>
                Catalogo de Materias Primas e Insumos
              </h2>
              <p className="text-xs text-slate-500 mt-1">
                Registro detallado de materias primas: Producto, Precio de Costo, Proveedor Habitual y Stock Almacen.
              </p>
            </div>

            <div className="flex items-center gap-3">
              <div className="text-right hidden sm:block bg-emerald-50 px-3.5 py-1.5 rounded-xl border border-emerald-100">
                <span className="text-[10px] uppercase font-bold text-emerald-700 block">Total en Almacen</span>
                <span className="text-sm font-black text-emerald-900 font-mono-code">{formatCurrency(totalRawValuation)}</span>
              </div>
              
              <button
                onClick={() => onOpenModal('newRawMaterial', null)}
                className="inline-flex items-center gap-2 px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl shadow-sm transition"
              >
                <i className="fas fa-plus"></i>
                <span>Nueva Materia Prima</span>
              </button>
            </div>
          </div>

          <div className="flex flex-col sm:flex-row items-center justify-between gap-3 bg-white p-3 rounded-xl border border-slate-200 text-xs">
            <div className="relative w-full sm:w-72">
              <i className="fas fa-search absolute left-3 top-3 text-slate-400"></i>
              <input
                type="text"
                placeholder="Buscar por nombre o codigo de insumo..."
                value={search}
                onChange={(e) => setSearch(e.target.value)}
                className="w-full pl-9 pr-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500"
              />
            </div>

            <div className="flex flex-wrap items-center gap-2 w-full sm:w-auto">
              <div className="flex items-center gap-1">
                <span className="text-slate-500 font-medium">Proveedor:</span>
                <select
                  value={filterSupplier}
                  onChange={(e) => setFilterSupplier(e.target.value)}
                  className="px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500"
                >
                  <option value="ALL">Todos los proveedores</option>
                  {suppliers.map(s => (
                    <option key={s.id} value={s.id}>{s.name}</option>
                  ))}
                </select>
              </div>

              <div className="flex items-center gap-1">
                <span className="text-slate-500 font-medium">Categoria:</span>
                <select
                  value={filterCategory}
                  onChange={(e) => setFilterCategory(e.target.value)}
                  className="px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500"
                >
                  <option value="ALL">Todas las categorias</option>
                  {categories.map(c => (
                    <option key={c} value={c}>{c}</option>
                  ))}
                </select>
              </div>
            </div>
          </div>

          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead className="bg-slate-50 text-slate-600 font-semibold border-b border-slate-200">
                  <tr>
                    <th className="py-3 px-4">Codigo</th>
                    <th className="py-3 px-4">Materia Prima</th>
                    <th className="py-3 px-4">Unidad</th>
                    <th className="py-3 px-4">Precio Costo ($)</th>
                    <th className="py-3 px-4">Proveedor Habitual</th>
                    <th className="py-3 px-4 text-center">Stock Actual</th>
                    <th className="py-3 px-4 text-right">Valorizado ($)</th>
                    <th className="py-3 px-4 text-center">Estado</th>
                    <th className="py-3 px-4 text-right">Acciones</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {filtered.length === 0 ? (
                    <tr>
                      <td colSpan="9" className="py-8 text-center text-slate-400">
                        No hay materias primas registradas. Haga clic en "Nueva Materia Prima" para comenzar.
                      </td>
                    </tr>
                  ) : (
                    filtered.map(rm => {
                      const supplier = suppliers.find(s => s.id === rm.supplierId);
                      const isCritical = rm.currentStock <= rm.minStock;
                      const valorized = rm.currentStock * rm.costPrice;

                      return (
                        <tr key={rm.id} className="table-row-hover">
                          <td className="py-3 px-4 font-mono font-semibold text-slate-600">{rm.code}</td>
                          <td className="py-3 px-4">
                            <div className="font-bold text-slate-800">{rm.name}</div>
                            <div className="text-[11px] text-slate-400">{rm.category || 'General'}</div>
                          </td>
                          <td className="py-3 px-4">
                            <span className="bg-slate-100 text-slate-700 px-2 py-0.5 rounded font-mono font-medium">
                              {rm.unit}
                            </span>
                          </td>
                          <td className="py-3 px-4 font-mono font-bold text-slate-800">
                            {formatCurrency(rm.costPrice)}
                          </td>
                          <td className="py-3 px-4">
                            {supplier ? (
                              <div>
                                <span className="font-semibold text-slate-700">{supplier.name}</span>
                                <span className="block text-[10px] text-slate-400 font-mono">CUIT: {supplier.cuit}</span>
                              </div>
                            ) : (
                              <span className="text-slate-400 italic">Sin proveedor asignado</span>
                            )}
                          </td>
                          <td className="py-3 px-4 text-center font-mono font-black text-sm">
                            <span className={isCritical ? 'text-rose-600' : 'text-slate-800'}>
                              {formatNumber(rm.currentStock)} {rm.unit}
                            </span>
                            <span className="block text-[10px] text-slate-400 font-normal">Min: {rm.minStock} {rm.unit}</span>
                          </td>
                          <td className="py-3 px-4 text-right font-mono font-bold text-emerald-800">
                            {formatCurrency(valorized)}
                          </td>
                          <td className="py-3 px-4 text-center">
                            <span className={`inline-block px-2.5 py-1 rounded-full text-[10px] font-bold ${
                              isCritical ? 'badge-stock-danger' : 'badge-stock-ok'
                            }`}>
                              {isCritical ? 'Reponer' : 'Optimo'}
                            </span>
                          </td>
                          <td className="py-3 px-4 text-right">
                            <div className="flex items-center justify-end space-x-1">
                              <button
                                onClick={() => onOpenModal('quickStockAdjust', { type: 'MP', id: rm.id, currentStock: rm.currentStock, name: rm.name, unit: rm.unit })}
                                className="p-1.5 text-slate-500 hover:text-amber-600 rounded transition"
                                title="Ajuste Rapido de Inventario"
                              >
                                <i className="fas fa-sliders"></i>
                              </button>
                              <button
                                onClick={() => onOpenModal('duplicateRawMaterial', rm)}
                                className="p-1.5 text-slate-500 hover:text-sky-600 rounded transition"
                                title="Copiar / Duplicar Materia Prima"
                              >
                                <i className="fas fa-copy"></i>
                              </button>
                              <button
                                onClick={() => onOpenModal('editRawMaterial', rm)}
                                className="p-1.5 text-slate-500 hover:text-emerald-600 rounded transition"
                                title="Editar Datos"
                              >
                                <i className="fas fa-pen-to-square"></i>
                              </button>
                              <button
                                onClick={() => onDelete(rm.id)}
                                className="p-1.5 text-slate-500 hover:text-rose-600 rounded transition"
                                title="Eliminar"
                              >
                                <i className="fas fa-trash-can"></i>
                              </button>
                            </div>
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>
          </div>

        </div>
      );
    }

    // -----------------------------
    // 3. PRODUCTS VIEW & BOM
    // -----------------------------
    function ProductsView({ products, rawMaterials, suppliers, onOpenModal, onDelete }) {
      const [search, setSearch] = useState('');
      const [expandedBomId, setExpandedBomId] = useState(null);

      const filtered = useMemo(() => {
        return products.filter(p => 
          p.name.toLowerCase().includes(search.toLowerCase()) ||
          p.code.toLowerCase().includes(search.toLowerCase())
        );
      }, [products, search]);

      return (
        <div className="space-y-5 animate-fade-in">
          
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
            <div>
              <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                <i className="fas fa-box-open text-amber-600"></i>
                Mercaderias y Recetas de Fabricacion (BOM)
              </h2>
              <p className="text-xs text-slate-500 mt-1">
                Gestion de mercaderias: Precio de venta, Stock y Check List de materias primas que consume por unidad.
              </p>
            </div>

            <button
              onClick={() => onOpenModal('newProduct', null)}
              className="inline-flex items-center gap-2 px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold rounded-xl shadow-sm transition"
            >
              <i className="fas fa-plus"></i>
              <span>Nueva Mercaderia</span>
            </button>
          </div>

          <div className="bg-white p-3 rounded-xl border border-slate-200 flex items-center justify-between gap-3 text-xs">
            <div className="relative w-full sm:w-80">
              <i className="fas fa-search absolute left-3 top-3 text-slate-400"></i>
              <input
                type="text"
                placeholder="Buscar mercaderia..."
                value={search}
                onChange={(e) => setSearch(e.target.value)}
                className="w-full pl-9 pr-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-500"
              />
            </div>
            <div className="text-slate-500 text-xs hidden sm:block">
              Mostrando {filtered.length} productos terminados
            </div>
          </div>

          {filtered.length === 0 ? (
            <div className="bg-white rounded-2xl p-12 text-center border border-slate-200 text-slate-400">
              <i className="fas fa-box-open text-4xl mb-3 text-slate-300"></i>
              <p className="text-sm font-medium">No hay mercaderias registradas en el catalogo.</p>
              <p className="text-xs text-slate-400 mt-1">Haga clic en "Nueva Mercaderia" para configurar productos y sus recetas BOM.</p>
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
              {filtered.map(product => {
                const bomCost = calculateBomUnitCost(product.bom, rawMaterials);
                const grossProfit = product.salePrice - bomCost;
                const grossMargin = product.salePrice > 0 ? (grossProfit / product.salePrice * 100).toFixed(1) : '0';
                const maxImmediateProduction = calculateMaxProduction(product.bom, rawMaterials);
                const isExpanded = expandedBomId === product.id;

                return (
                  <div key={product.id} className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col justify-between hover:border-slate-300 transition">
                    
                    <div className="p-5">
                      <div className="flex justify-between items-start">
                        <div>
                          <span className="text-[10px] font-mono font-bold bg-amber-100 text-amber-900 px-2 py-0.5 rounded">
                            {product.code}
                          </span>
                          <h3 className="text-base font-bold text-slate-900 mt-1">{product.name}</h3>
                          <p className="text-xs text-slate-500">{product.category || 'General'}</p>
                        </div>

                        <div className="text-right">
                          <span className="text-[10px] uppercase font-bold text-slate-400 block">Precio de Venta</span>
                          <span className="text-lg font-black text-slate-900 font-mono-code">{formatCurrency(product.salePrice)}</span>
                        </div>
                      </div>

                      <div className="mt-4 grid grid-cols-3 gap-2 bg-slate-50 p-3 rounded-xl border border-slate-100 text-center text-xs">
                        <div>
                          <span className="text-[10px] text-slate-500 block">Costo BOM Insumos</span>
                          <span className="font-bold text-slate-800 font-mono-code">{formatCurrency(bomCost)}</span>
                        </div>
                        <div>
                          <span className="text-[10px] text-slate-500 block">Margen Bruto</span>
                          <span className="font-bold text-emerald-700 font-mono-code">{grossMargin}%</span>
                        </div>
                        <div>
                          <span className="text-[10px] text-slate-500 block">Stock Actual</span>
                          <span className="font-bold text-amber-800 font-mono-code">{product.currentStock} u</span>
                        </div>
                      </div>

                      <div className="mt-3 flex items-center justify-between text-xs bg-emerald-50 px-3 py-2 rounded-xl border border-emerald-100">
                        <div className="flex items-center gap-2 text-emerald-900">
                          <i className="fas fa-gauge-high text-emerald-600"></i>
                          <span className="font-semibold">Capacidad de Fabricacion Inmediata:</span>
                        </div>
                        <span className="font-bold text-emerald-900 font-mono-code">{maxImmediateProduction} Unidades</span>
                      </div>

                      <div className="mt-4">
                        <button
                          onClick={() => setExpandedBomId(isExpanded ? null : product.id)}
                          className="w-full flex items-center justify-between text-xs font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 px-3 py-2 rounded-lg transition"
                        >
                          <span className="flex items-center gap-2">
                            <i className="fas fa-list-check text-amber-600"></i>
                            <span>Check List de Materias Primas que consume ({(product.bom || []).length} insumos)</span>
                          </span>
                          <i className={`fas fa-chevron-${isExpanded ? 'up' : 'down'} text-[10px]`}></i>
                        </button>

                        {isExpanded && (
                          <div className="mt-2 space-y-1.5 p-2 bg-slate-50 rounded-lg border border-slate-200 animate-fade-in text-xs">
                            {(!product.bom || product.bom.length === 0) ? (
                              <p className="text-slate-400 italic p-2 text-center">No tiene materias primas asignadas en su receta.</p>
                            ) : (
                              product.bom.map((item, idx) => {
                                const rm = rawMaterials.find(r => r.id === item.rawMaterialId);
                                const supp = rm ? suppliers.find(s => s.id === rm.supplierId) : null;
                                const unitCost = rm ? rm.costPrice : 0;
                                const totalLineCost = unitCost * item.quantity;
                                const hasEnough = rm && rm.currentStock >= item.quantity;

                                return (
                                  <div key={idx} className="flex items-center justify-between p-2 bg-white rounded-lg border border-slate-200">
                                    <div>
                                      <div className="font-semibold text-slate-800">{rm ? rm.name : 'MP no encontrada'}</div>
                                      <div className="text-[11px] text-slate-400 font-mono">
                                        Consume: {formatNumber(item.quantity, 3)} {rm ? rm.unit : 'u'} por unidad
                                        {supp && <span className="ml-2 text-emerald-700 font-semibold">• Prov: {supp.name}</span>}
                                      </div>
                                    </div>
                                    <div className="text-right font-mono">
                                      <span className="text-slate-700 font-medium">{formatCurrency(totalLineCost)}</span>
                                      <span className={`block text-[10px] font-bold ${hasEnough ? 'text-emerald-600' : 'text-rose-600'}`}>
                                        {rm ? 'Stock: ' + formatNumber(rm.currentStock) + ' ' + rm.unit : 'Sin stock'}
                                      </span>
                                    </div>
                                  </div>
                                );
                              })
                            )}
                          </div>
                        )}
                      </div>

                    </div>

                    <div className="bg-slate-50 px-5 py-3 border-t border-slate-100 flex items-center justify-between text-xs">
                      <button
                        onClick={() => onOpenModal('newProduction', { preselectedProductId: product.id })}
                        className="inline-flex items-center gap-1.5 font-bold text-amber-700 hover:text-amber-900"
                      >
                        <i className="fas fa-industry"></i>
                        <span>Crear Orden de Fabricacion</span>
                      </button>

                      <div className="flex items-center space-x-1">
                        <button
                          onClick={() => onOpenModal('quickStockAdjust', { type: 'PT', id: product.id, currentStock: product.currentStock, name: product.name, unit: 'u' })}
                          className="p-1.5 text-slate-500 hover:text-amber-600 rounded transition"
                          title="Ajuste de Stock Fisico"
                        >
                          <i className="fas fa-sliders"></i>
                        </button>
                        <button
                          onClick={() => onOpenModal('duplicateProduct', product)}
                          className="p-1.5 text-slate-500 hover:text-sky-600 rounded transition"
                          title="Copiar / Duplicar Mercaderia y Receta"
                        >
                          <i className="fas fa-copy"></i>
                        </button>
                        <button
                          onClick={() => onOpenModal('editProduct', product)}
                          className="p-1.5 text-slate-500 hover:text-emerald-600 rounded transition"
                          title="Editar Receta / Mercaderia"
                        >
                          <i className="fas fa-pen-to-square"></i>
                        </button>
                        <button
                          onClick={() => onDelete(product.id)}
                          className="p-1.5 text-slate-500 hover:text-rose-600 rounded transition"
                          title="Eliminar Mercaderia"
                        >
                          <i className="fas fa-trash-can"></i>
                        </button>
                      </div>
                    </div>

                  </div>
                );
              })}
            </div>
          )}

        </div>
      );

    // 7. CREDIT & DEBIT NOTES VIEW (NOTAS DE CREDITO Y DEBITO AFIP)
    // -----------------------------
    function CreditDebitNotesView({ transactions, allSales, clients, products, onOpenNewNote, onViewVoucher }) {
      const [filterType, setFilterType] = useState('ALL');
      const [search, setSearch] = useState('');

      const filteredNotes = useMemo(() => {
        return transactions.filter(t => {
          const matchType = filterType === 'ALL' || t.type === filterType;
          const searchLower = search.toLowerCase();
          const matchSearch = (t.invoiceNumber && t.invoiceNumber.toLowerCase().includes(searchLower)) ||
                              (t.code && t.code.toLowerCase().includes(searchLower)) ||
                              (t.associatedInvoiceNumber && t.associatedInvoiceNumber.toLowerCase().includes(searchLower)) ||
                              (t.entityName && t.entityName.toLowerCase().includes(searchLower)) ||
                              (t.entityCuit && t.entityCuit.includes(search)) ||
                              (t.reason && t.reason.toLowerCase().includes(searchLower));
          return matchType && matchSearch;
        });
      }, [transactions, filterType, search]);

      const totalNC = useMemo(() => {
        return transactions.filter(t => t.type === 'NOTA_CREDITO').reduce((acc, t) => acc + (Number(t.totalAmount) || 0), 0);
      }, [transactions]);

      const totalND = useMemo(() => {
        return transactions.filter(t => t.type === 'NOTA_DEBITO').reduce((acc, t) => acc + (Number(t.totalAmount) || 0), 0);
      }, [transactions]);

      return (
        <div className="space-y-5 animate-fade-in">
          
          {/* HEADER & ACTIONS */}
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
            <div>
              <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                <i className="fas fa-file-circle-minus text-rose-600"></i>
                Notas de Credito y Debito (AFIP)
              </h2>
              <p className="text-xs text-slate-500 mt-1">
                Ajustes fiscales de facturacion: anula facturas por error, registra devoluciones de mercaderia a stock o aplica recargos y cargos adicionales.
              </p>
            </div>

            <button
              onClick={() => onOpenNewNote(null)}
              className="inline-flex items-center gap-2 px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold rounded-xl shadow-sm transition"
            >
              <i className="fas fa-plus"></i>
              <span>+ Nueva Nota de Credito / Debito</span>
            </button>
          </div>

          {/* SUMMARY CARDS */}
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-xs">
              <span className="text-[11px] font-bold text-rose-700 uppercase tracking-wider block">Total Notas de Credito (NC)</span>
              <div className="text-xl font-black text-rose-800 mt-1 font-mono-code">{formatCurrency(totalNC)}</div>
              <span className="text-[10px] text-slate-400 block mt-0.5">Anulaciones, devoluciones y descuentos</span>
            </div>

            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-xs">
              <span className="text-[11px] font-bold text-indigo-700 uppercase tracking-wider block">Total Notas de Debito (ND)</span>
              <div className="text-xl font-black text-indigo-800 mt-1 font-mono-code">{formatCurrency(totalND)}</div>
              <span className="text-[10px] text-slate-400 block mt-0.5">Cargos, intereses o despachos extra</span>
            </div>

            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-xs">
              <span className="text-[11px] font-bold text-slate-600 uppercase tracking-wider block">Comprobantes Emitidos</span>
              <div className="text-xl font-black text-slate-900 mt-1 font-mono-code">{transactions.length}</div>
              <span className="text-[10px] text-slate-400 block mt-0.5">Registrados en libro diario y AFIP</span>
            </div>
          </div>

          {/* FILTERS & SEARCH */}
          <div className="flex flex-col sm:flex-row items-center justify-between gap-3 bg-white p-3 rounded-xl border border-slate-200 text-xs">
            <div className="relative w-full sm:w-80">
              <i className="fas fa-search absolute left-3 top-3 text-slate-400"></i>
              <input
                type="text"
                placeholder="Buscar por Nro comprobante, factura ref, cliente..."
                value={search}
                onChange={(e) => setSearch(e.target.value)}
                className="w-full pl-9 pr-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-rose-500"
              />

            <div className="flex items-center gap-2 w-full sm:w-auto">
              <span className="text-slate-500 font-medium">Tipo:</span>
              <select
                value={filterType}

                <option value="ALL">Todas las Notas ({transactions.length})</option>
                <option value="NOTA_CREDITO">Notas de Credito (NC - Cod 03)</option>
                <option value="NOTA_DEBITO">Notas de Debito (ND - Cod 02)</option>

                    filteredNotes.map(t => (

                          <span className={`px-2 py-0.5 rounded-full font-bold text-[10px] ${

                        <td className="py-3 px-4 text-right">

    // 2. PRODUCT & BOM FORM MODAL (MATERIAS PRIMAS RELACIONADAS POR PROVEEDOR EN CADA FILA)
    function ProductFormModal({ isEdit, isDuplicate, initialData, rawMaterials, suppliers, onSave, onClose }) {
      const [formData, setFormData] = useState(() => {
        const rawBom = initialData?.bom || [];
        const mappedBom = rawBom.map(item => {
          const rm = rawMaterials.find(r => r.id === item.rawMaterialId);
          const suppId = item.supplierId || (rm ? rm.supplierId : (suppliers[0]?.id || ''));
          return {
            supplierId: suppId,
            rawMaterialId: item.rawMaterialId || (rm ? rm.id : ''),
            quantity: item.quantity !== undefined ? item.quantity : 1
          };
        });

        return {
          id: isEdit ? (initialData?.id || '') : '',
          code: isEdit ? (initialData?.code || '') : '',
          name: isDuplicate ? `${initialData?.name || ''} (Copia)` : (initialData?.name || ''),
          category: initialData?.category || 'General',
          salePrice: initialData?.salePrice || '',
          currentStock: isDuplicate ? '0' : (initialData?.currentStock || '0'),
          minStock: initialData?.minStock || '10',
          description: initialData?.description || '',
          bom: mappedBom
        };
      });

      const calculatedCost = useMemo(() => {
        return calculateBomUnitCost(formData.bom, rawMaterials);
      }, [formData.bom, rawMaterials]);

      const grossMargin = useMemo(() => {
        const price = Number(formData.salePrice) || 0;
        if (price <= 0) return 0;
        return ((price - calculatedCost) / price * 100).toFixed(1);
      }, [formData.salePrice, calculatedCost]);

      const handleAddBomItem = () => {
        if (suppliers.length === 0) {
          alert('Primero debe registrar al menos un Proveedor en el sistema.');
          return;
        }
        if (rawMaterials.length === 0) {
          alert('Primero debe registrar materias primas en el sistema para agregarlas a la receta BOM.');
          return;
        }

        // Default to first supplier that has raw materials, or first supplier
        const suppWithRm = suppliers.find(s => rawMaterials.some(rm => rm.supplierId === s.id)) || suppliers[0];
        const suppId = suppWithRm ? suppWithRm.id : '';
        const availableRms = rawMaterials.filter(rm => rm.supplierId === suppId);
        const rmId = availableRms.length > 0 ? availableRms[0].id : '';

        setFormData(prev => ({
          ...prev,
          bom: [...prev.bom, { supplierId: suppId, rawMaterialId: rmId, quantity: 1 }]
        }));
      };

      const handleUpdateBomItem = (index, field, value) => {
        setFormData(prev => {
          const newBom = [...prev.bom];
          if (field === 'supplierId') {
            const availableRms = rawMaterials.filter(rm => rm.supplierId === value);
            const newRmId = availableRms.length > 0 ? availableRms[0].id : '';
            newBom[index] = {
              ...newBom[index],
              supplierId: value,
              rawMaterialId: newRmId
            };
          } else {
            newBom[index] = { ...newBom[index], [field]: value };
          }
          return { ...prev, bom: newBom };
        });
      };

      const handleRemoveBomItem = (index) => {
        setFormData(prev => ({
          ...prev,
          bom: prev.bom.filter((_, idx) => idx !== index)
        }));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.name.trim()) {
          alert('Ingrese el nombre de la mercaderia');
          return;
        }
        if (Number(formData.salePrice) <= 0) {
          alert('El precio de venta debe ser mayor a cero');
          return;
        }
        for (let i = 0; i < formData.bom.length; i++) {
          const item = formData.bom[i];
          if (!item.supplierId) {
            alert(`El insumo #${i + 1} no tiene un proveedor seleccionado.`);
            return;
          }
          if (!item.rawMaterialId) {
            alert(`El insumo #${i + 1} no tiene una materia prima valida seleccionada para el proveedor elegido.`);
            return;
          }
          if (Number(item.quantity) <= 0) {
            alert(`La cantidad del insumo #${i + 1} debe ser mayor a cero.`);
            return;
          }
        }
        onSave(formData);
      };

      return (
        <div className="p-6">
          <div className="flex justify-between items-center pb-4 border-b border-slate-200">
            <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2">

              <span>{isEdit ? 'Editar Mercaderia y Receta BOM' : isDuplicate ? 'Duplicar / Copiar Mercaderia y Receta BOM' : 'Nueva Mercaderia / Producto Terminado'}</span>
            </h3>
            <button onClick={onClose} className="text-slate-400 hover:text-slate-600 p-1">
              <i className="fas fa-times text-lg"></i>
            </button>
          </div>

          <form onSubmit={handleSubmit} className="mt-5 space-y-4 text-xs">
            
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label className="block font-bold text-slate-700 mb-1">Nombre de la Mercaderia *</label>
                <input
                  type="text"
                  required
                  placeholder="Ej: Barrita Proteica, Granola, Crema de Mani"
                  value={formData.name}
                  onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none"
                />
              </div>

              <div>
                <label className="block font-bold text-slate-700 mb-1">Categoria</label>
                <input
                  type="text"
                  placeholder="Ej: Snacks, Granola, Untables"
                  value={formData.category}
                  onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none"
                />
              </div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div>
                <label className="block font-bold text-slate-700 mb-1">Precio de Venta Sugerido ($) *</label>
                <input
                  type="number"
                  step="0.01"
                  required
                  placeholder="0.00"
                  value={formData.salePrice}
                  onChange={(e) => setFormData({ ...formData, salePrice: e.target.value })}
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg font-mono focus:ring-2 focus:ring-amber-500 focus:outline-none"
                />
              </div>

              <div>
                <label className="block font-bold text-slate-700 mb-1">Stock Actual Inicial (Unidades) *</label>
                <input
                  type="number"
                  required
                  placeholder="0"
                  value={formData.currentStock}
                  onChange={(e) => setFormData({ ...formData, currentStock: e.target.value })}
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg font-mono focus:ring-2 focus:ring-amber-500 focus:outline-none"
                />
              </div>

              <div>
                <label className="block font-bold text-slate-700 mb-1">Stock Minimo (Alerta) *</label>
                <input
                  type="number"
                  required
                  placeholder="10"
                  value={formData.minStock}
                  onChange={(e) => setFormData({ ...formData, minStock: e.target.value })}
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg font-mono focus:ring-2 focus:ring-amber-500 focus:outline-none"
                />
              </div>
            </div>

            {/* BOM CHECKLIST SECTION RELACIONADA CON PROVEEDORES POR FILA */}
            <div className="pt-3 border-t border-slate-200">
              <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-2">
                <div>
                  <span className="font-bold text-slate-800 text-sm flex items-center gap-1.5">
                    <i className="fas fa-list-check text-amber-600"></i>
                    Check List de Materias Primas que Consume por Unidad
                  </span>
                  <span className="text-[11px] text-slate-500 block">
                    Para cada insumo, seleccione el proveedor correspondiente y su materia prima asociada.
                  </span>
                </div>

                <button
                  type="button"
                  onClick={handleAddBomItem}
                  className="px-3 py-1.5 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-lg transition text-xs flex items-center gap-1 whitespace-nowrap shadow-xs"
                >
                  <i className="fas fa-plus"></i>
                  <span>+ Agregar Insumo</span>
                </button>
              </div>

              {/* Table header for BOM rows */}
              {formData.bom.length > 0 && (
                <div className="hidden sm:grid grid-cols-12 gap-2 px-3 py-1.5 bg-slate-100 rounded-t-lg text-[11px] font-bold text-slate-600">
                  <div className="col-span-4">Proveedor</div>
                  <div className="col-span-4">Materia Prima (Asociada)</div>
                  <div className="col-span-2">Cantidad Consumida</div>
                  <div className="col-span-1 text-right">Costo</div>
                  <div className="col-span-1 text-center">Quitar</div>
                </div>

              <div className="space-y-2 max-h-56 overflow-y-auto p-1 bg-slate-50 rounded-xl border border-slate-200">
                {formData.bom.length === 0 ? (

                    <p className="italic">No hay materias primas agregadas a la receta.</p>
                    <p className="text-[10px] mt-0.5">Haga clic en "+ Agregar Insumo" para vincular materias primas de los proveedores.</p>
                  </div>
                ) : (
                  formData.bom.map((item, idx) => {
                    const availableRmsForSupplier = rawMaterials.filter(rm => rm.supplierId === item.supplierId);
                    const selectedRm = rawMaterials.find(r => r.id === item.rawMaterialId);
                    const unitCost = selectedRm ? selectedRm.costPrice : 0;
                    const lineCost = unitCost * (Number(item.quantity) || 0);

                    return (
                      <div key={idx} className="bg-white p-2.5 rounded-lg border border-slate-200 shadow-2xs space-y-2 sm:space-y-0 sm:grid sm:grid-cols-12 sm:gap-2 sm:items-center">
                        
                        {/* Selector de Proveedor */}
                        <div className="sm:col-span-4">
                          <label className="block sm:hidden text-[10px] font-bold text-slate-500 mb-0.5">Proveedor:</label>
                          <select
                            value={item.supplierId}
                            onChange={(e) => handleUpdateBomItem(idx, 'supplierId', e.target.value)}
                            className="w-full px-2.5 py-1.5 border border-slate-300 rounded text-xs bg-white font-medium text-slate-800 focus:ring-1 focus:ring-amber-500 focus:outline-none"
                          >
                            <option value="" disabled>Seleccione Proveedor...</option>
                            {suppliers.map(s => {
                              const count = rawMaterials.filter(rm => rm.supplierId === s.id).length;
                              return (
                                <option key={s.id} value={s.id}>
                                  {s.name} ({count} MP disponibles)
                                </option>
                              );
                            })}
                          </select>
                        </div>

                        {/* Selector de Materia Prima filtrado por el proveedor de esta fila */}
                        <div className="sm:col-span-4">
                          <label className="block sm:hidden text-[10px] font-bold text-slate-500 mb-0.5">Materia Prima:</label>
                          <select
                            value={item.rawMaterialId}
                            onChange={(e) => handleUpdateBomItem(idx, 'rawMaterialId', e.target.value)}
                            className={`w-full px-2.5 py-1.5 border rounded text-xs bg-white font-medium focus:ring-1 focus:ring-amber-500 focus:outline-none ${
                              availableRmsForSupplier.length === 0 ? 'border-amber-300 text-amber-700 bg-amber-50' : 'border-slate-300 text-slate-800'
                            }`}
                          >
                            {availableRmsForSupplier.length === 0 ? (
                              <option value="">(Sin materias primas para este proveedor)</option>
                            ) : (
                              availableRmsForSupplier.map(rm => (
                                <option key={rm.id} value={rm.id}>
                                  {rm.name} ({rm.unit}) - {formatCurrency(rm.costPrice)}
                                </option>
                              ))
                            )}
                          </select>
                        </div>

                        {/* Cantidad consumida */}
                        <div className="sm:col-span-2">
                          <label className="block sm:hidden text-[10px] font-bold text-slate-500 mb-0.5">Cantidad:</label>
                          <div className="relative">
                            <input
                              type="number"
                              step="0.001"
                              placeholder="Cantidad"
                              value={item.quantity}
                              onChange={(e) => handleUpdateBomItem(idx, 'quantity', e.target.value)}
                              className="w-full px-2 py-1.5 border border-slate-300 rounded font-mono text-xs pr-6 focus:ring-1 focus:ring-amber-500 focus:outline-none"
                            />
                            <span className="absolute right-2 top-1.5 text-slate-400 text-[10px] pointer-events-none">
                              {selectedRm?.unit || 'u'}
                            </span>
                          </div>
                        </div>

                        {/* Costo de la linea */}
                        <div className="sm:col-span-1 text-right font-mono font-bold text-slate-700 text-xs">
                          <span className="inline sm:hidden text-[10px] text-slate-400 font-normal mr-1">Costo:</span>
                          {formatCurrency(lineCost)}
                        </div>

                        {/* Boton Quitar */}
                        <div className="sm:col-span-1 text-center">
                          <button
                            type="button"
                            onClick={() => handleRemoveBomItem(idx)}
                            className="p-1.5 text-rose-500 hover:text-rose-700 hover:bg-rose-50 rounded transition"
                            title="Quitar de la receta"
                          >
                            <i className="fas fa-trash-can"></i>
                          </button>
                        </div>

                      </div>
                    );
                  })
                )}
              </div>

              <div className="mt-3 bg-amber-50 border border-amber-200 p-3 rounded-xl flex justify-between items-center text-xs">
                <div>
                  <span className="text-amber-800 font-bold block">Costo de Produccion BOM Estimado:</span>
                  <span className="text-xs text-amber-700 font-mono-code">{formatCurrency(calculatedCost)} por unidad</span>
                </div>
                <div className="text-right">
                  <span className="text-amber-800 font-bold block">Margen Bruto de Ganancia:</span>
                  <span className="text-sm font-black text-emerald-800 font-mono-code">{grossMargin}%</span>
                </div>
              </div>

            </div>

            <div className="pt-4 border-t border-slate-200 flex justify-end space-x-3">
              <button
                type="button"
                onClick={onClose}
                className="px-4 py-2 border border-slate-300 rounded-xl text-slate-700 hover:bg-slate-100 font-semibold"
              >
                Cancelar
              </button>
              <button
                type="submit"
                className="px-5 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-xl font-bold shadow-sm"
              >
                {isEdit ? 'Actualizar Mercaderia' : isDuplicate ? 'Guardar Copia de Mercaderia' : 'Guardar Mercaderia y Receta'}
              </button>
            </div>

          </form>
        </div>
      );
    }

            <div className="pt-4 border-t border-slate-200 flex justify-end space-x-3">
              <button
                type="button"

                Cancelar

    // 5. PURCHASE FORM MODAL (COMPRAS)
    function PurchaseFormModal({ suppliers, rawMaterials, onSave, onClose }) {
      const [supplierId, setSupplierId] = useState(suppliers[0]?.id || '');
      const [referenceNumber, setReferenceNumber] = useState('');
      const [notes, setNotes] = useState('');
      const [updateCosts, setUpdateCosts] = useState(true);

      const filteredRawMaterials = useMemo(() => {
        if (!supplierId) return rawMaterials;
        const fromThisSupplier = rawMaterials.filter(r => r.supplierId === supplierId);
        return fromThisSupplier.length > 0 ? fromThisSupplier : rawMaterials;
      }, [supplierId, rawMaterials]);

      const [items, setItems] = useState(() => {
        const initRm = rawMaterials.find(r => r.supplierId === (suppliers[0]?.id || '')) || rawMaterials[0];
        return [
          { rawMaterialId: initRm?.id || '', quantity: 1, unitPrice: initRm?.costPrice || 0 }
        ];
      });

      const selectedSupplier = useMemo(() => {
        return suppliers.find(s => s.id === supplierId);
      }, [supplierId, suppliers]);

      const totalAmount = useMemo(() => {
        return items.reduce((acc, it) => acc + ((Number(it.quantity) || 0) * (Number(it.unitPrice) || 0)), 0);
      }, [items]);

      const handleAddItem = () => {
        if (rawMaterials.length === 0) return;
        const defaultRm = filteredRawMaterials[0] || rawMaterials[0];
        setItems(prev => [
          ...prev,
          { rawMaterialId: defaultRm.id, quantity: 1, unitPrice: defaultRm.costPrice }
        ]);
      };

      const handleUpdateItem = (index, field, value) => {
        setItems(prev => {
          const newItems = [...prev];
          if (field === 'rawMaterialId') {
            const rm = rawMaterials.find(r => r.id === value);
            newItems[index] = {
              ...newItems[index],
              rawMaterialId: value,
              unitPrice: rm ? rm.costPrice : newItems[index].unitPrice
            };
          } else {
            newItems[index] = { ...newItems[index], [field]: value };
          }
          return newItems;
        });
      };

      const handleRemoveItem = (index) => {
        setItems(prev => prev.filter((_, idx) => idx !== index));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!supplierId) {
          alert('Seleccione un proveedor');
          return;
        }
        if (items.length === 0) {
          alert('Agregue al menos una materia prima');
          return;
        }
        for (const item of items) {
          if (Number(item.quantity) <= 0) {
            alert('Las cantidades deben ser mayores a cero');
            return;
          }
        }
        onSave({
          supplierId,
          referenceNumber,
          items,
          notes,
          updateCosts
        });
      };

      return (
        <div className="p-6">
          <div className="flex justify-between items-center pb-4 border-b border-slate-200">
            <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2">
              <i className="fas fa-cart-plus text-emerald-600"></i>
              <span>Registrar Compra de Materias Primas (+ Entrada Almacen)</span>
            </h3>
            <button onClick={onClose} className="text-slate-400 hover:text-slate-600 p-1">
              <i className="fas fa-times text-lg"></i>
            </button>
          </div>

          <form onSubmit={handleSubmit} className="mt-5 space-y-4 text-xs">
            
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label className="block font-bold text-slate-700 mb-1">Proveedor *</label>
                <select
                  value={supplierId}
                  onChange={(e) => setSupplierId(e.target.value)}
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-white font-medium"
                >
                  {suppliers.map(s => (
                    <option key={s.id} value={s.id}>{s.name} ({s.cuit})</option>
                  ))}
                </select>
                {selectedSupplier && (
                  <div className="mt-1 text-[11px] text-slate-500">
                    CUIT: <span className="font-mono font-semibold">{selectedSupplier.cuit}</span> | {selectedSupplier.address}
                  </div>
                )}
              </div>

              <div>
                <label className="block font-bold text-slate-700 mb-1">Nro Comprobante / Factura / Remito *</label>
                <input
                  type="text"
                  required
                  placeholder="Ej: FC-0001-000123"
                  value={referenceNumber}
                  onChange={(e) => setReferenceNumber(e.target.value)}
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg font-mono focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                />
              </div>
            </div>

            <div className="pt-2 border-t border-slate-200">
              <div className="flex justify-between items-center mb-2">
                <span className="font-bold text-slate-800 text-sm">Detalle de Materias Primas a Ingresar:</span>
                <button
                  type="button"
                  onClick={handleAddItem}
                  className="px-3 py-1 bg-emerald-100 hover:bg-emerald-200 text-emerald-900 font-bold rounded-lg transition text-xs flex items-center gap-1"
                >
                  <i className="fas fa-plus"></i>
                  <span>+ Agregar Item</span>
                </button>
              </div>

              <div className="space-y-2 max-h-48 overflow-y-auto p-1 bg-slate-50 rounded-xl border border-slate-200">
                {items.map((item, idx) => {
                  const rm = rawMaterials.find(r => r.id === item.rawMaterialId);
                  const subtotal = (Number(item.quantity) || 0) * (Number(item.unitPrice) || 0);

                  return (
                    <div key={idx} className="flex items-center gap-2 bg-white p-2.5 rounded-lg border border-slate-200">
                      <div className="flex-1">
                        <select
                          value={item.rawMaterialId}
                          onChange={(e) => handleUpdateItem(idx, 'rawMaterialId', e.target.value)}
                          className="w-full px-2.5 py-1.5 border border-slate-300 rounded text-xs bg-white"
                        >
                          {filteredRawMaterials.map(r => (
                            <option key={r.id} value={r.id}>
                              {r.name} (Stock: {formatNumber(r.currentStock)} {r.unit})
                            </option>
                          ))}
                        </select>
                      </div>

                      <div className="w-28">
                        <div className="relative">
                          <input
                            type="number"
                            step="0.01"
                            placeholder="Cantidad"
                            value={item.quantity}
                            onChange={(e) => handleUpdateItem(idx, 'quantity', e.target.value)}
                            className="w-full px-2 py-1.5 border border-slate-300 rounded font-mono text-xs pr-6"
                          />
                          <span className="absolute right-2 top-1.5 text-slate-400 text-[10px]">
                            {rm?.unit || 'u'}
                          </span>
                        </div>
                      </div>

                      <div className="w-28">
                        <input
                          type="number"
                          step="0.01"
                          placeholder="Precio Compra $"
                          value={item.unitPrice}
                          onChange={(e) => handleUpdateItem(idx, 'unitPrice', e.target.value)}
                          className="w-full px-2 py-1.5 border border-slate-300 rounded font-mono text-xs"
                        />
                      </div>

                      <div className="w-24 text-right font-mono font-bold text-emerald-800 text-xs">
                        {formatCurrency(subtotal)}
                      </div>

                      <button
                        type="button"
                        onClick={() => handleRemoveItem(idx)}
                        className="text-rose-500 hover:text-rose-700 p-1"
                      >
                        <i className="fas fa-trash-can"></i>
                      </button>
                    </div>
                  );
                })}
              </div>

              <div className="mt-3 flex items-center justify-between">
                <label className="flex items-center gap-2 text-xs text-slate-600 cursor-pointer">
                  <input
                    type="checkbox"
                    checked={updateCosts}
                    onChange={(e) => setUpdateCosts(e.target.checked)}
                    className="rounded text-emerald-600 focus:ring-emerald-500"
                  />
                  <span>Actualizar el precio de costo estandar de la materia prima con estos valores</span>
                </label>

                <div className="text-right">
                  <span className="text-xs text-slate-500 block">Total de la Compra:</span>
                  <span className="text-xl font-black text-emerald-900 font-mono-code">{formatCurrency(totalAmount)}</span>
                </div>
              </div>
            </div>

            <div>
              <label className="block font-bold text-slate-700 mb-1">Observaciones</label>
              <input
                type="text"
                placeholder="Lote de proveedor, remito de entrega..."
                value={notes}
                onChange={(e) => setNotes(e.target.value)}
                className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none"
              />
            </div>

            <div className="pt-4 border-t border-slate-200 flex justify-end space-x-3">
              <button
                type="button"
                onClick={onClose}
                className="px-4 py-2 border border-slate-300 rounded-xl text-slate-700 hover:bg-slate-100 font-semibold"
              >
                Cancelar
              </button>
              <button
                type="submit"
                className="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold shadow-sm flex items-center gap-2"
              >
                <i className="fas fa-check"></i>
                <span>Confirmar Ingreso al Stock</span>
              </button>

          </form>
        </div>
      );

    // 6. PRODUCTION FORM MODAL (CON SOPORTE PARA FABRICAR MULTIPLES MERCADERIAS EN LA MISMA ORDEN)
    function ProductionFormModal({ initialData, products, rawMaterials, suppliers, onSave, onClose }) {
      const [items, setItems] = useState(() => {
        const initialProdId = initialData?.preselectedProductId || products[0]?.id || '';
        return [{ productId: initialProdId, quantity: 1 }];
      });
      const [batchNumber, setBatchNumber] = useState('LOTE-' + new Date().getFullYear() + '-' + String(Date.now()).slice(-4));
      const [notes, setNotes] = useState('');

      const handleAddItem = () => {
        const firstUnused = products.find(p => !items.some(it => it.productId === p.id)) || products[0];
        setItems(prev => [...prev, { productId: firstUnused?.id || '', quantity: 1 }]);
      };

      const handleUpdateItem = (index, field, value) => {
        setItems(prev => {
          const newItems = [...prev];
          newItems[index] = { ...newItems[index], [field]: value };
          return newItems;
        });
      };

      const handleRemoveItem = (index) => {
        if (items.length <= 1) return;
        setItems(prev => prev.filter((_, idx) => idx !== index));
      };

      // Consolidated calculation of raw materials across all products in the batch
      const { bomBreakdown, totalProductionCost, hasShortage, totalUnitsToProduce } = useMemo(() => {
        const neededMap = {};
        let totalUnits = 0;

        for (const it of items) {
          const qty = Number(it.quantity) || 0;
          if (qty <= 0) continue;
          totalUnits += qty;
          const prod = products.find(p => p.id === it.productId);
          if (!prod || !prod.bom) continue;

          for (const bomItem of prod.bom) {
            const rm = rawMaterials.find(r => r.id === bomItem.rawMaterialId);
            const supp = rm ? suppliers.find(s => s.id === rm.supplierId) : null;
            const lineNeeded = (Number(bomItem.quantity) || 0) * qty;

            if (!neededMap[bomItem.rawMaterialId]) {
              neededMap[bomItem.rawMaterialId] = {
                rawMaterialId: bomItem.rawMaterialId,
                rm,
                supp,
                totalNeeded: 0,
                unitCost: rm ? rm.costPrice : 0,
                consumedBy: []
              };
            }
            neededMap[bomItem.rawMaterialId].totalNeeded += lineNeeded;
            neededMap[bomItem.rawMaterialId].consumedBy.push({
              productName: prod.name,
              qtyNeeded: lineNeeded
            });
          }
        }

        const breakdown = Object.values(neededMap).map(b => {
          const available = b.rm ? b.rm.currentStock : 0;
          const isSufficient = available >= b.totalNeeded;
          const lineCost = b.unitCost * b.totalNeeded;
          return {
            ...b,
            available,
            isSufficient,
            lineCost
          };
        });

        const totalCost = breakdown.reduce((acc, b) => acc + b.lineCost, 0);
        const shortage = breakdown.some(b => !b.isSufficient);

        return {
          bomBreakdown: breakdown,
          totalProductionCost: totalCost,
          hasShortage: shortage,
          totalUnitsToProduce: totalUnits
        };
      }, [items, products, rawMaterials, suppliers]);

      const handleSubmit = (e) => {
        e.preventDefault();
        const validItems = items.filter(it => it.productId && Number(it.quantity) > 0);
        if (validItems.length === 0) {
          alert('Agregue al menos una mercaderia con cantidad mayor a cero');
          return;
        }
        if (hasShortage) {
          alert('No hay stock suficiente de materias primas para completar la orden de produccion.');
          return;
        }
        onSave({
          items: validItems,
          batchNumber,
          notes
        });
      };

      return (
        <div className="p-6">
          <div className="flex justify-between items-center pb-4 border-b border-slate-200">
            <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2">
              <i className="fas fa-industry text-amber-600"></i>
              <span>Registrar Orden de Produccion Multi-Mercaderia (- MP / + Mercaderias)</span>
            </h3>
            <button onClick={onClose} className="text-slate-400 hover:text-slate-600 p-1">
              <i className="fas fa-times text-lg"></i>
            </button>
          </div>

          <form onSubmit={handleSubmit} className="mt-5 space-y-4 text-xs">
            
            {/* Lote y Observaciones */}
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label className="block font-bold text-slate-700 mb-1">Numero de Lote General *</label>
                <input
                  type="text"
                  required
                  value={batchNumber}
                  onChange={(e) => setBatchNumber(e.target.value)}
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg font-mono focus:ring-2 focus:ring-amber-500 focus:outline-none"
                />
              </div>

              <div>
                <label className="block font-bold text-slate-700 mb-1">Observaciones / Turno de Planta</label>
                <input
                  type="text"
                  placeholder="Ej: Turno maniana, lote combinado, operario..."
                  value={notes}
                  onChange={(e) => setNotes(e.target.value)}
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none"
                />
              </div>
            </div>

            {/* Lista de Mercaderias a Producir */}
            <div className="pt-2 border-t border-slate-200">
              <div className="flex justify-between items-center mb-2">
                <div>
                  <span className="font-bold text-slate-800 text-sm flex items-center gap-1.5">
                    <i className="fas fa-boxes-stacked text-amber-600"></i>
                    Mercaderias a Fabricar en esta Orden ({items.length})
                  </span>
                  <span className="text-[11px] text-slate-500 block">
                    Puede agregar varios tipos de mercaderias para elaborarlas conjuntamente en el mismo lote.
                  </span>
                </div>

                <button
                  type="button"
                  onClick={handleAddItem}
                  className="px-3 py-1.5 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-lg transition text-xs flex items-center gap-1 shadow-xs"
                >
                  <i className="fas fa-plus"></i>
                  <span>+ Agregar Otra Mercaderia</span>
                </button>
              </div>

              <div className="space-y-2 max-h-48 overflow-y-auto p-1 bg-slate-50 rounded-xl border border-slate-200">
                {items.map((item, idx) => {
                  const prod = products.find(p => p.id === item.productId);
                  const maxIndividualCap = prod ? calculateMaxProduction(prod.bom, rawMaterials) : 0;

                  return (
                    <div key={idx} className="bg-white p-2.5 rounded-lg border border-slate-200 shadow-2xs flex flex-col sm:flex-row items-start sm:items-center gap-2">
                      <div className="flex-1 w-full">
                        <label className="block sm:hidden text-[10px] font-bold text-slate-500 mb-0.5">Mercaderia:</label>
                        <select
                          value={item.productId}
                          onChange={(e) => handleUpdateItem(idx, 'productId', e.target.value)}
                          className="w-full px-2.5 py-1.5 border border-slate-300 rounded text-xs bg-white font-medium text-slate-800 focus:ring-1 focus:ring-amber-500 focus:outline-none"
                        >
                          {products.map(p => (
                            <option key={p.id} value={p.id}>
                              {p.name} (Stock: {p.currentStock} u | BOM: {(p.bom || []).length} insumos)
                            </option>
                          ))}
                        </select>
                      </div>

                      <div className="w-full sm:w-36">
                        <label className="block sm:hidden text-[10px] font-bold text-slate-500 mb-0.5">Cantidad (u):</label>
                        <div className="relative">
                          <input
                            type="number"
                            min="1"
                            placeholder="Cantidad"
                            value={item.quantity}
                            onChange={(e) => handleUpdateItem(idx, 'quantity', e.target.value)}
                            className="w-full px-2.5 py-1.5 border border-slate-300 rounded font-mono text-xs font-bold focus:ring-1 focus:ring-amber-500 focus:outline-none pr-8"
                          />
                          <span className="absolute right-2 top-1.5 text-slate-400 text-[10px]">u</span>
                        </div>
                      </div>

                      <div className="w-full sm:w-auto flex items-center justify-between sm:justify-start gap-2">
                        <button
                          type="button"
                          onClick={() => handleUpdateItem(idx, 'quantity', maxIndividualCap > 0 ? maxIndividualCap : 1)}
                          className="px-2 py-1 bg-amber-100 hover:bg-amber-200 text-amber-900 rounded font-bold text-[10px] whitespace-nowrap"
                          title={`Capacidad individual actual: ${maxIndividualCap} u`}
                        >
                          Max: {maxIndividualCap} u
                        </button>

                        {items.length > 1 && (
                          <button
                            type="button"
                            onClick={() => handleRemoveItem(idx)}
                            className="p-1.5 text-rose-500 hover:text-rose-700 hover:bg-rose-50 rounded transition"
                            title="Quitar mercaderia"
                          >
                            <i className="fas fa-trash-can"></i>
                          </button>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Impacto Consolidado de Materias Primas */}
            <div className="pt-2 border-t border-slate-200">
              <span className="font-bold text-slate-800 text-sm block mb-1">
                Impacto Consolidado en Materias Primas (- Stock):
              </span>

              <div className="space-y-1.5 max-h-48 overflow-y-auto p-2 bg-slate-50 rounded-xl border border-slate-200">
                {bomBreakdown.length === 0 ? (
                  <p className="text-slate-400 text-center py-2 italic">No hay materias primas requeridas para las mercaderias seleccionadas.</p>
                ) : (
                  bomBreakdown.map((b, idx) => (
                    <div key={idx} className={`flex items-center justify-between p-2 rounded-lg border ${
                      b.isSufficient ? 'bg-white border-slate-200' : 'bg-rose-50 border-rose-300'
                    }`}>
                      <div>
                        <div className="font-bold text-slate-800 flex items-center gap-1.5">
                          <span>{b.rm ? b.rm.name : 'Insumo'}</span>
                          {b.supp && <span className="text-[10px] text-emerald-700 font-semibold">• Prov: {b.supp.name}</span>}
                        </div>
                        <div className="text-[11px] text-slate-500 font-mono">
                          Consumo total del lote: <strong className="text-rose-700">-{formatNumber(b.totalNeeded, 3)} {b.rm?.unit}</strong>
                          <span className="text-[10px] text-slate-400 ml-2">
                            ({b.consumedBy.map(c => `${c.productName}: ${formatNumber(c.qtyNeeded, 2)}`).join(', ')})
                          </span>
                        </div>
                      </div>
                      <div className="text-right font-mono">
                        <span className="font-bold text-slate-700">{formatCurrency(b.lineCost)}</span>
                        <span className={`block text-[10px] font-bold ${b.isSufficient ? 'text-emerald-600' : 'text-rose-600'}`}>
                          {b.isSufficient ? 'Stock Disp: ' + formatNumber(b.available) + ' ' + b.rm?.unit : 'FALTANTE (Hay: ' + formatNumber(b.available) + ' ' + b.rm?.unit + ')'}
                        </span>
                      </div>
                    </div>
                  ))
                )}
              </div>

              <div className="mt-3 grid grid-cols-3 gap-2 bg-slate-100 p-3 rounded-xl text-center">
                <div>
                  <span className="text-slate-600 text-[10px] block uppercase font-bold">Unidades Fabricadas:</span>
                  <span className="text-base font-black text-amber-900 font-mono-code">{totalUnitsToProduce} u</span>
                </div>
                <div>
                  <span className="text-slate-600 text-[10px] block uppercase font-bold">Costo Total Insumos:</span>
                  <span className="text-base font-black text-slate-900 font-mono-code">{formatCurrency(totalProductionCost)}</span>
                </div>
                <div>
                  <span className="text-slate-600 text-[10px] block uppercase font-bold">Costo Promedio Unitario:</span>
                  <span className="text-base font-black text-slate-900 font-mono-code">
                    {formatCurrency(totalUnitsToProduce > 0 ? (totalProductionCost / totalUnitsToProduce) : 0)} / u
                  </span>
                </div>
              </div>
            </div>

            <div className="pt-4 border-t border-slate-200 flex justify-end space-x-3">
              <button
                type="button"
                onClick={onClose}
                className="px-4 py-2 border border-slate-300 rounded-xl text-slate-700 hover:bg-slate-100 font-semibold"
              >
                Cancelar
              </button>
              <button
                type="submit"
                disabled={hasShortage || bomBreakdown.length === 0 || totalUnitsToProduce <= 0}
                className={`px-5 py-2 rounded-xl font-bold shadow-sm flex items-center gap-2 text-white ${
                  hasShortage || bomBreakdown.length === 0 || totalUnitsToProduce <= 0 ? 'bg-slate-400 cursor-not-allowed' : 'bg-amber-600 hover:bg-amber-700'
                }`}
              >
                <i className="fas fa-gears"></i>
                <span>Ejecutar Orden de Fabricacion</span>
              </button>
            </div>

          </form>
        </div>
      );

    // 7. SALE FORM MODAL (FACTURACION Y VENTA A CLIENTES - FACTURA A)
    function SaleFormModal({ clients, products, transactions, onSave, onClose }) {
      const nextSaleNum = (transactions.filter(t => t.type === 'VENTA').length + 1);
      const defaultSeq = String(nextSaleNum).padStart(8, '0');

      const [clientId, setClientId] = useState(clients[0]?.id || '');
      const [invoiceType, setInvoiceType] = useState('FACTURA_A');
      const [posNumber, setPosNumber] = useState('0001');
      const [seqNumber, setSeqNumber] = useState(defaultSeq);
      const [referenceNumber, setReferenceNumber] = useState('');
      const [notes, setNotes] = useState('');

      const [items, setItems] = useState([
        { productId: products[0]?.id || '', quantity: 1, unitPrice: products[0]?.salePrice || 0 }
      ]);

      const invoiceLetter = invoiceType === 'FACTURA_A' ? 'A' : invoiceType === 'FACTURA_B' ? 'B' : 'C';
      const formattedInvoiceNumber = `${invoiceLetter}-${posNumber}-${seqNumber}`;

      const selectedClient = useMemo(() => {
        return clients.find(c => c.id === clientId);
      }, [clientId, clients]);

      const totalAmount = useMemo(() => {
        return items.reduce((acc, it) => acc + ((Number(it.quantity) || 0) * (Number(it.unitPrice) || 0)), 0);
      }, [items]);

      const netAmount = useMemo(() => {
        return Math.round((totalAmount / 1.21) * 100) / 100;
      }, [totalAmount]);

      const ivaAmount = useMemo(() => {
        return Math.round((totalAmount - netAmount) * 100) / 100;
      }, [totalAmount, netAmount]);

      const handleAddItem = () => {
        if (products.length === 0) return;
        setItems(prev => [
          ...prev,
          { productId: products[0].id, quantity: 1, unitPrice: products[0].salePrice }
        ]);
      };

      const handleUpdateItem = (index, field, value) => {
        setItems(prev => {
          const newItems = [...prev];
          if (field === 'productId') {
            const prod = products.find(p => p.id === value);
            newItems[index] = {
              ...newItems[index],
              productId: value,
              unitPrice: prod ? prod.salePrice : newItems[index].unitPrice
            };
          } else {
            newItems[index] = { ...newItems[index], [field]: value };
          }
          return newItems;
        });
      };

      const handleRemoveItem = (index) => {
        setItems(prev => prev.filter((_, idx) => idx !== index));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!clientId) {
          alert('Seleccione un cliente para emitir la factura');
          return;
        }
        if (items.length === 0) {
          alert('Agregue al menos una mercaderia a vender');
          return;
        }
        for (const item of items) {
          const prod = products.find(p => p.id === item.productId);
          if (Number(item.quantity) <= 0) {
            alert('Las cantidades deben ser mayores a cero');
            return;
          }
          if (!prod || prod.currentStock < Number(item.quantity)) {
            alert('Stock insuficiente de "' + (prod?.name || 'Mercaderia') + '". Disponible: ' + (prod?.currentStock || 0) + ' u.');
            return;
          }

        onSave({
          clientId,
          invoiceType: invoiceType === 'FACTURA_A' ? 'FACTURA A' : invoiceType === 'FACTURA_B' ? 'FACTURA B' : 'FACTURA C',
          invoiceLetter,
          pointOfSale: posNumber,
          invoiceSeq: seqNumber,
          invoiceNumber: formattedInvoiceNumber,
          referenceNumber: referenceNumber || formattedInvoiceNumber,
          items,
          notes
        });
      };

      return (
        <div className="p-6">

            <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2">
              <i className="fas fa-file-invoice-dollar text-sky-600"></i>
              <span>Emitir Factura de Venta AFIP y Despachar (- Stock)</span>

            <button onClick={onClose} className="text-slate-400 hover:text-slate-600 p-1">
              <i className="fas fa-times text-lg"></i>
            </button>
          </div>

          <form onSubmit={handleSubmit} className="mt-5 space-y-4 text-xs">
            
            {/* INVOICE & CLIENT HEADER */}
