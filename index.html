              <div>
                <label className="block font-bold text-slate-700 mb-1">Tipo de Comprobante *</label>
                <select
                  value={invoiceType}
                  onChange={(e) => setInvoiceType(e.target.value)}
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none bg-white font-bold text-sky-900"
                >
                  <option value="FACTURA_A">Factura A (Cod. 01) - Resp. Inscripto</option>
                  <option value="FACTURA_B">Factura B (Cod. 06) - Consumidor Final</option>
                  <option value="FACTURA_C">Factura C (Cod. 11) - Exento</option>
                </select>
                <span className="text-[10px] text-sky-800 font-semibold block mt-1">
                  Emisor: FUTURE FOOD SAS (IVA Resp. Inscripto)
                </span>
              </div>

              <div>
                <label className="block font-bold text-slate-700 mb-1">Punto de Venta y Nro *</label>
                <div className="flex items-center gap-1.5">
                  <span className="font-bold text-slate-700 text-sm">{invoiceLetter}</span>
                  <input
                    type="text"
                    required
                    maxLength="4"
                    value={posNumber}
                    onChange={(e) => setPosNumber(e.target.value.padStart(4, '0').slice(-4))}
                    className="w-16 px-2 py-2 border border-slate-300 rounded-lg font-mono font-bold text-center text-slate-800"
                    placeholder="0001"
                    title="Punto de Venta"
                  />
                  <span className="text-slate-400 font-bold">-</span>
                  <input
                    type="text"
                    required
                    maxLength="8"
                    value={seqNumber}
                    onChange={(e) => setSeqNumber(e.target.value)}
                    className="flex-1 px-2.5 py-2 border border-slate-300 rounded-lg font-mono font-bold text-sky-900 focus:ring-2 focus:ring-sky-500"
                    placeholder="00000001"
                    title="Numero Correlativo"
                  />
                </div>
                <span className="text-[11px] font-mono text-slate-500 block mt-1">
                  Comprobante: <strong>{formattedInvoiceNumber}</strong>
                </span>
              </div>

              <div>
                <label className="block font-bold text-slate-700 mb-1">Cliente / Receptor *</label>
                <select
                  value={clientId}
                  onChange={(e) => setClientId(e.target.value)}
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none bg-white font-medium"
                >
                  {clients.map(c => (
                    <option key={c.id} value={c.id}>{c.name} ({c.cuit})</option>
                  ))}
                </select>
                {selectedClient && (
                  <div className="mt-1 text-[11px] text-slate-600 truncate">
                    CUIT: <span className="font-mono font-bold">{selectedClient.cuit}</span> | {selectedClient.address || 'Domicilio fiscal'}
                  </div>
                )}
              </div>
            </div>

            {/* MERCHANDISE ITEMS */}
            <div className="pt-2 border-t border-slate-200">
              <div className="flex justify-between items-center mb-2">
                <span className="font-bold text-slate-800 text-sm flex items-center gap-1.5">
                  <i className="fas fa-boxes-stacked text-sky-600"></i>
                  <span>Mercaderias a Facturar y Despachar:</span>
                </span>
                <button
                  type="button"
                  onClick={handleAddItem}
                  className="px-3 py-1 bg-sky-100 hover:bg-sky-200 text-sky-900 font-bold rounded-lg transition text-xs flex items-center gap-1 shadow-xs"
                >
                  <i className="fas fa-plus"></i>
                  <span>+ Agregar Mercaderia</span>
                </button>
              </div>

              <div className="space-y-2 max-h-52 overflow-y-auto p-1 bg-slate-50 rounded-xl border border-slate-200">
                {items.map((item, idx) => {
                  const prod = products.find(p => p.id === item.productId);
                  const subtotal = (Number(item.quantity) || 0) * (Number(item.unitPrice) || 0);
                  const netUnit = Math.round(((Number(item.unitPrice) || 0) / 1.21) * 100) / 100;

                  return (
                    <div key={idx} className="flex items-center gap-2 bg-white p-2.5 rounded-lg border border-slate-200 shadow-xs">
                      <div className="flex-1">
                        <label className="block text-[10px] text-slate-400 font-bold mb-0.5">Producto</label>
                        <select
                          value={item.productId}

                          {products.map(p => (
                            <option key={p.id} value={p.id}>

                      </div>

                      <div className="w-24">
                        <label className="block text-[10px] text-slate-400 font-bold mb-0.5 text-center">Cantidad (u)</label>
                        <input
                          type="number"
                          min="1"
                          placeholder="Cantidad"
                          value={item.quantity}
                          onChange={(e) => handleUpdateItem(idx, 'quantity', e.target.value)}
                          className="w-full px-2 py-1.5 border border-slate-300 rounded font-mono text-xs text-center font-bold"
                        />
                      </div>

                      <div className="w-28">
                        <label className="block text-[10px] text-slate-400 font-bold mb-0.5">Precio Unit. ($)</label>
                        <input
                          type="number"
                          step="0.01"
                          placeholder="Precio Venta"
                          value={item.unitPrice}
                          onChange={(e) => handleUpdateItem(idx, 'unitPrice', e.target.value)}
                          className="w-full px-2 py-1.5 border border-slate-300 rounded font-mono text-xs font-semibold"
                        />
                      </div>

                      <div className="w-24 text-right">
                        <label className="block text-[10px] text-slate-400 font-bold mb-0.5">Subtotal ($)</label>
                        <div className="font-mono font-bold text-sky-900 text-xs pt-1.5">
                          {formatCurrency(subtotal)}
                        </div>
                      </div>

                      <button
                        type="button"
                        onClick={() => handleRemoveItem(idx)}
                        className="text-rose-500 hover:text-rose-700 p-1 mt-3.5"
                        title="Eliminar item"
                      >
                        <i className="fas fa-trash-can"></i>
                      </button>
                    </div>
                  );
                })}
              </div>

              {/* FISCAL TOTALS BREAKDOWN */}
              <div className="mt-3 grid grid-cols-1 sm:grid-cols-3 gap-3 bg-slate-100 p-3 rounded-xl border border-slate-200">
                <div className="text-left">
                  <span className="text-[11px] text-slate-500 font-bold block">Subtotal Neto Gravado (21%):</span>
                  <span className="text-base font-bold text-slate-800 font-mono">{formatCurrency(netAmount)}</span>
                </div>
                <div className="text-left">
                  <span className="text-[11px] text-slate-500 font-bold block">IVA Liquidado (21%):</span>
                  <span className="text-base font-bold text-slate-800 font-mono">{formatCurrency(ivaAmount)}</span>
                </div>
                <div className="text-left sm:text-right">
                  <span className="text-[11px] text-sky-800 font-bold block uppercase tracking-wider">Total Facturado (AFIP):</span>
                  <span className="text-xl font-black text-sky-900 font-mono">{formatCurrency(totalAmount)}</span>
                </div>
              </div>
            </div>

            <div>
              <label className="block font-bold text-slate-700 mb-1">Observaciones / Guia de Despacho</label>
              <input
                type="text"
                placeholder="Transporte, remitente, guia de despacho..."
                value={notes}
                onChange={(e) => setNotes(e.target.value)}
                className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none"
              />
            </div>

            <div className="pt-4 border-t border-slate-200 flex justify-end space-x-3">
              <button
                type="button"
                onClick={onClose}
                className="px-4 py-2 border border-slate-300 rounded-xl text-slate-700 hover:bg-slate-100 font-semibold"
              >
                Cancelar
              </button>
              <button
                type="submit"
                className="px-5 py-2 bg-sky-600 hover:bg-sky-700 text-white rounded-xl font-bold shadow-sm flex items-center gap-2"
              >
                <i className="fas fa-file-invoice"></i>
                <span>Confirmar Venta y Emitir Factura A</span>
              </button>
            </div>

          </form>
        </div>
      );
    }

    // 8. CREDIT & DEBIT NOTE MODAL (AFIP NC / ND)
    function CreditDebitNoteModal({ initialData, clients, products, allSales, transactions, onSave, onClose }) {
      const [noteType, setNoteType] = useState(initialData?.type || 'NOTA_CREDITO');
      const [associatedInvoiceId, setAssociatedInvoiceId] = useState(initialData?.sale?.id || '');
      const [clientId, setClientId] = useState(initialData?.sale?.entityId || (clients[0]?.id || ''));
      
      const countNC = transactions.filter(t => t.type === 'NOTA_CREDITO').length + 1;
      const countND = transactions.filter(t => t.type === 'NOTA_DEBITO').length + 1;
      
      const defaultSeq = noteType === 'NOTA_CREDITO' ? String(countNC).padStart(8, '0') : String(countND).padStart(8, '0');
      const [posNumber, setPosNumber] = useState('0001');
      const [seqNumber, setSeqNumber] = useState(defaultSeq);
      
      const [reason, setReason] = useState(
        noteType === 'NOTA_CREDITO' 
          ? 'Devolucion de mercaderia con reingreso a stock' 
          : 'Cargo o despacho adicional no facturado'
      );
      const [returnStock, setReturnStock] = useState(true);
      const [notes, setNotes] = useState('');

      // Initial items
      const getInitialItems = () => {
        if (initialData?.sale?.items && initialData.sale.items.length > 0) {
          return initialData.sale.items.map(it => ({
            productId: it.id || it.productId || '',
            name: it.name,
            quantity: it.quantity,
            unitPrice: it.unitPrice
          }));
        }
        return [
          { productId: products[0]?.id || '', name: products[0]?.name || 'Mercaderia', quantity: 1, unitPrice: products[0]?.salePrice || 0 }
        ];
      };

      const [items, setItems] = useState(getInitialItems());

      // When associated invoice changes
      const handleSelectSale = (saleId) => {
        setAssociatedInvoiceId(saleId);
        if (!saleId) return;
        const sale = allSales.find(s => s.id === saleId);
        if (sale) {
          setClientId(sale.entityId);
          if (sale.items && sale.items.length > 0) {
            setItems(sale.items.map(it => ({
              productId: it.id || it.productId || '',
              name: it.name,
              quantity: it.quantity,
              unitPrice: it.unitPrice
            })));
          }
        }
      };

      const selectedClient = useMemo(() => {
        return clients.find(c => c.id === clientId);
      }, [clientId, clients]);

      const selectedSale = useMemo(() => {
        return allSales.find(s => s.id === associatedInvoiceId);
      }, [associatedInvoiceId, allSales]);

      const prefix = noteType === 'NOTA_CREDITO' ? 'NC' : 'ND';
      const formattedNumber = `${prefix}-A-${posNumber}-${seqNumber}`;

      const totalAmount = useMemo(() => {
        return items.reduce((acc, it) => acc + ((Number(it.quantity) || 0) * (Number(it.unitPrice) || 0)), 0);
      }, [items]);

      const netAmount = useMemo(() => {
        return Math.round((totalAmount / 1.21) * 100) / 100;
      }, [totalAmount]);

      const ivaAmount = useMemo(() => {
        return Math.round((totalAmount - netAmount) * 100) / 100;
      }, [totalAmount, netAmount]);

      const handleAddItem = () => {
        if (products.length === 0) {
          setItems(prev => [...prev, { productId: '', name: 'Concepto Facturado', quantity: 1, unitPrice: 0 }]);
          return;
        }
        setItems(prev => [
          ...prev,
          { productId: products[0].id, name: products[0].name, quantity: 1, unitPrice: products[0].salePrice }
        ]);
      };

      const handleUpdateItem = (index, field, value) => {
        setItems(prev => {
          const newItems = [...prev];
          if (field === 'productId') {
            const prod = products.find(p => p.id === value);
            newItems[index] = {
              ...newItems[index],
              productId: value,
              name: prod ? prod.name : newItems[index].name,
              unitPrice: prod ? prod.salePrice : newItems[index].unitPrice
            };
          } else {
            newItems[index] = { ...newItems[index], [field]: value };
          }
          return newItems;
        });
      };

      const handleRemoveItem = (index) => {
        setItems(prev => prev.filter((_, idx) => idx !== index));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!clientId) {
          alert('Seleccione un cliente para la nota');
          return;
        }
        if (items.length === 0) {
          alert('Agregue al menos un concepto o mercaderia');
          return;
        }
        for (const it of items) {
          if (Number(it.quantity) <= 0) {
            alert('La cantidad debe ser mayor a cero');
            return;
          }
          if (Number(it.unitPrice) < 0) {
            alert('El precio no puede ser negativo');
            return;
          }
        }

        onSave({
          noteType,
          invoiceLetter: 'A',
          pointOfSale: posNumber,
          noteSeq: seqNumber,
          noteNumber: formattedNumber,
          associatedInvoiceId,
          associatedInvoiceNumber: selectedSale ? (selectedSale.invoiceNumber || selectedSale.code) : '',
          clientId,
          reason,
          returnStock,
          items,
          notes
        });
      };

      return (
        <div className="p-6">

            <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2">
              <i className={`fas ${noteType === 'NOTA_CREDITO' ? 'fa-file-circle-minus text-rose-600' : 'fa-file-circle-plus text-indigo-600'}`}></i>
              <span>{noteType === 'NOTA_CREDITO' ? 'Emitir Nota de Credito A (Cod. 03)' : 'Emitir Nota de Debito A (Cod. 02)'}</span>
            </h3>
            <button onClick={onClose} className="text-slate-400 hover:text-slate-600 p-1">
              <i className="fas fa-times text-lg"></i>
            </button>
          </div>

          <form onSubmit={handleSubmit} className="mt-5 space-y-4 text-xs">
            
            {/* COMPROBANTE SELECTOR & ASSOCIATED INVOICE */}

              <div>
                <label className="block font-bold text-slate-700 mb-1">Tipo de Comprobante *</label>
                <select
                  value={noteType}
                  onChange={(e) => {
                    const newT = e.target.value;
                    setNoteType(newT);
                    const newCount = transactions.filter(t => t.type === newT).length + 1;
                    setSeqNumber(String(newCount).padStart(8, '0'));
                    setReason(newT === 'NOTA_CREDITO' ? 'Devolucion de mercaderia con reingreso a stock' : 'Cargo o despacho adicional no facturado');
                  }}
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-rose-500 focus:outline-none bg-white font-bold text-slate-900"
                >
                  <option value="NOTA_CREDITO">Nota de Credito A (Cod. 03 AFIP) - Anulacion / Devolucion</option>
                  <option value="NOTA_DEBITO">Nota de Debito A (Cod. 02 AFIP) - Cargo Adicional</option>
                </select>
              </div>

              <div>
                <label className="block font-bold text-slate-700 mb-1">Factura Asociada (Opcional)</label>
                <select
                  value={associatedInvoiceId}
                  onChange={(e) => handleSelectSale(e.target.value)}
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-rose-500 focus:outline-none bg-white font-medium"
                >
                  <option value="">(Sin asociar directamente / Carga libre)</option>
                  {allSales.map(s => (
                    <option key={s.id} value={s.id}>
                      {s.invoiceNumber || s.code} - {s.entityName} (${formatNumber(s.totalAmount)})
                    </option>
                  ))}
                </select>
                {selectedSale && (
                  <span className="text-[10px] text-sky-800 font-semibold block mt-1">
                    Asociada a: {selectedSale.invoiceNumber || selectedSale.code} ({formatDate(selectedSale.date)})
                  </span>
                )}
              </div>

              <div>
                <label className="block font-bold text-slate-700 mb-1">Punto de Venta y Nro *</label>
                <div className="flex items-center gap-1.5">
                  <span className="font-bold text-slate-700 text-sm font-mono">{prefix}-A</span>
                  <input
                    type="text"
                    required
                    maxLength="4"
                    value={posNumber}
                    onChange={(e) => setPosNumber(e.target.value.padStart(4, '0').slice(-4))}
                    className="w-16 px-2 py-2 border border-slate-300 rounded-lg font-mono font-bold text-center text-slate-800"
                    placeholder="0001"
                  />
                  <span className="text-slate-400 font-bold">-</span>
                  <input
                    type="text"
                    required
                    maxLength="8"
                    value={seqNumber}
                    onChange={(e) => setSeqNumber(e.target.value)}
                    className="flex-1 px-2.5 py-2 border border-slate-300 rounded-lg font-mono font-bold text-slate-900 focus:ring-2 focus:ring-rose-500"
                    placeholder="00000001"
                  />
                </div>
              </div>
            </div>

            {/* CLIENT & REASON */}
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label className="block font-bold text-slate-700 mb-1">Cliente / Receptor *</label>
                <select
                  value={clientId}
                  onChange={(e) => setClientId(e.target.value)}
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-rose-500 focus:outline-none bg-white font-medium"
                >
                  {clients.map(c => (
                    <option key={c.id} value={c.id}>{c.name} ({c.cuit})</option>
                  ))}
                </select>
                {selectedClient && (
                  <div className="mt-1 text-[11px] text-slate-500">
                    CUIT: <span className="font-mono font-bold">{selectedClient.cuit}</span> | {selectedClient.address || 'Domicilio fiscal'}
                  </div>

                      <option value="Diferencia de precio en mas">Diferencia de precio en mas</option>

                    <p className="text-xs text-slate-600 font-medium">Alimentos Funcionales y Saludables</p>
                    <p className="text-[11px] text-slate-500 mt-1 leading-relaxed">
                      CUIT: 30-71899012-3 | IVA Responsable Inscripto<br/>
                      Planta Industrial: Parque Industrial Este Lote 12<br/>
                      Tel: +54 351 555-4321 | contacto@futurefood.com.ar
                    </p>
                  </div>

                  <div className="text-right">
                    <div className="inline-block border-2 border-slate-800 px-4 py-1.5 text-center mb-1 rounded">
                      <span className="text-xs font-black block tracking-wider">
                        ORDEN DE FABRICACION
                      </span>
                      <span className="text-sm font-mono font-bold text-slate-900">
                        {doc.code}
                      </span>
                    </div>
                    <p className="text-xs text-slate-600 mt-1">Fecha: <strong>{formatDate(doc.date)}</strong></p>
                    <p className="text-xs text-slate-600 font-mono">Lote: <strong>{doc.batchNumber || doc.code}</strong></p>
                  </div>
                </div>

                <div className="my-4 space-y-4">
                  <div>
                    <span className="font-bold text-slate-800 text-xs block mb-1">
                      Mercaderias Fabricadas e Ingresadas al Deposito (+):
                    </span>
                    <table className="w-full text-left text-xs border border-slate-200">
                      <thead className="bg-amber-50 text-amber-900 font-bold border-b border-amber-200">
                        <tr>
                          <th className="py-2 px-3">Mercaderia</th>
                          <th className="py-2 px-3 text-center">Cantidad (+)</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {(doc.producedItems && doc.producedItems.length > 0) ? (
                          doc.producedItems.map((pi, idx) => (
                            <tr key={idx}>
                              <td className="py-2 px-3 font-semibold text-slate-800">{pi.productName}</td>
                              <td className="py-2 px-3 text-center font-mono font-bold text-amber-900">+{formatNumber(pi.quantity)} u</td>
                            </tr>
                          ))
                        ) : (
                          <tr>
                            <td className="py-2 px-3 font-semibold text-slate-800">{doc.productName}</td>
                            <td className="py-2 px-3 text-center font-mono font-bold text-amber-900">+{formatNumber(doc.quantityProduced)} u</td>
                          </tr>
                        )}
                      </tbody>
                    </table>
                  </div>

                  <div>
                    <span className="font-bold text-slate-800 text-xs block mb-1">
                      Materias Primas Consumidas (-):
                    </span>
                    <table className="w-full text-left text-xs border border-slate-200">
                      <thead className="bg-slate-100 text-slate-700 font-bold border-b border-slate-200">
                        <tr>
                          <th className="py-2 px-3">Materia Prima / Insumo</th>
                          <th className="py-2 px-3 text-center">Cantidad</th>
                          <th className="py-2 px-3 text-right">Costo Unit. ($)</th>
                          <th className="py-2 px-3 text-right">Subtotal ($)</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {(doc.consumedMaterials || []).map((it, idx) => (
                          <tr key={idx}>
                            <td className="py-2 px-3 font-medium text-slate-800">{it.name}</td>
                            <td className="py-2 px-3 text-center font-mono text-rose-700 font-semibold">-{formatNumber(it.quantity, 3)} {it.unit}</td>
                            <td className="py-2 px-3 text-right font-mono">{formatCurrency(it.unitCost)}</td>
                            <td className="py-2 px-3 text-right font-mono font-bold text-slate-800">{formatCurrency(it.subtotal)}</td>
                          </tr>
                        ))}
                      </tbody>
                      <tfoot className="bg-slate-50 font-bold border-t-2 border-slate-300">
                        <tr>
                          <td colSpan="3" className="py-2 px-3 text-right text-sm">TOTAL COSTO INSUMOS:</td>
                          <td className="py-2 px-3 text-right text-sm font-mono text-amber-900">
                            {formatCurrency(doc.totalCost || doc.totalAmount || 0)}
                          </td>
                        </tr>
                      </tfoot>
                    </table>
                  </div>
                </div>

                {doc.notes && (
                  <div className="text-[11px] text-slate-500 bg-slate-50 p-2.5 rounded-lg border border-slate-200 my-3">
                    <strong>Observaciones:</strong> {doc.notes}
                  </div>
                )}
              </div>
            ) : (
              // PURCHASE VOUCHER TEMPLATE
              <div>
                <div className="mt-4 pb-4 border-b-2 border-slate-800 flex justify-between items-start">
                  <div>
                    <h2 className="text-2xl font-black tracking-tight text-emerald-900">FUTURE FOOD SAS</h2>
                    <p className="text-xs text-slate-600 font-medium">Alimentos Funcionales y Saludables</p>
                    <p className="text-[11px] text-slate-500 mt-1 leading-relaxed">
                      CUIT: 30-71899012-3 | IVA Responsable Inscripto<br/>
                      Planta Industrial: Parque Industrial Este Lote 12<br/>
                      Tel: +54 351 555-4321 | contacto@futurefood.com.ar
                    </p>
                  </div>

                  <div className="text-right">
                    <div className="inline-block border-2 border-slate-800 px-4 py-1.5 text-center mb-1 rounded">
                      <span className="text-xs font-black block tracking-wider">
                        COMPROBANTE DE COMPRA
                      </span>
                      <span className="text-sm font-mono font-bold text-slate-900">
                        {doc.invoiceNumber || doc.code}
                      </span>
                    </div>
                    <p className="text-xs text-slate-600 mt-1">Fecha: <strong>{formatDate(doc.date)}</strong></p>
                    <p className="text-xs text-slate-600 font-mono">Ref: {doc.referenceNumber || doc.code}</p>
                  </div>
                </div>

                <div className="py-3 bg-slate-50 my-3 px-4 rounded-xl border border-slate-200 text-xs grid grid-cols-2 gap-4">
                  <div>
                    <span className="text-slate-400 block uppercase font-bold text-[10px]">Proveedor:</span>
                    <span className="font-bold text-slate-900 text-sm block">{doc.entityName}</span>
                    {doc.entityCuit && <span className="text-slate-600 font-mono block text-[11px]">CUIT: {doc.entityCuit}</span>}
                    {doc.entityAddress && <span className="text-slate-500 block text-[11px]">{doc.entityAddress}</span>}
                  </div>
                  <div className="text-right">
                    <span className="text-slate-400 block uppercase font-bold text-[10px]">Tipo de Operacion</span>
                    <span className="font-mono font-bold text-emerald-800 text-sm block">COMPRA MATERIAS PRIMAS</span>
                  </div>
                </div>

                <div className="my-4">
                  <table className="w-full text-left text-xs border border-slate-200">
                    <thead className="bg-slate-100 text-slate-700 font-bold border-b border-slate-200">
                      <tr>
                        <th className="py-2.5 px-3">Materia Prima</th>
                        <th className="py-2.5 px-3 text-center">Cantidad</th>
                        <th className="py-2.5 px-3 text-right">Precio Unit. ($)</th>
                        <th className="py-2.5 px-3 text-right">Subtotal ($)</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-200">
                      {(doc.items || []).map((it, idx) => (
                        <tr key={idx}>
                          <td className="py-2.5 px-3 font-medium text-slate-800">{it.name}</td>
                          <td className="py-2.5 px-3 text-center font-mono">{formatNumber(it.quantity)} {it.unit || 'Kg'}</td>
                          <td className="py-2.5 px-3 text-right font-mono">{formatCurrency(it.unitPrice)}</td>
                          <td className="py-2.5 px-3 text-right font-mono font-bold text-slate-800">{formatCurrency(it.subtotal)}</td>
                        </tr>
                      ))}
                    </tbody>
                    <tfoot className="bg-slate-50 font-bold border-t-2 border-slate-300">
                      <tr>
                        <td colSpan="3" className="py-2.5 px-3 text-right text-sm">TOTAL COMPRA:</td>
                        <td className="py-2.5 px-3 text-right text-sm font-mono text-emerald-900">
                          {formatCurrency(doc.totalAmount || 0)}
                        </td>
                      </tr>
                    </tfoot>
                  </table>
                </div>

                {doc.notes && (
                  <div className="text-[11px] text-slate-500 bg-slate-50 p-2.5 rounded-lg border border-slate-200 my-3">
                    <strong>Observaciones:</strong> {doc.notes}
                  </div>
                )}
              </div>
            )}

            {/* SIGNATURES */}
            <div className="mt-8 pt-8 border-t border-slate-300 grid grid-cols-2 gap-8 text-center text-xs text-slate-500">
              <div>
                <div className="border-b border-slate-400 w-40 mx-auto mb-1"></div>
                <span>Firma y Aclaracion Emisor</span>
              </div>
              <div>
                <div className="border-b border-slate-400 w-40 mx-auto mb-1"></div>
                <span>Recepcion Conforme / Cliente</span>
              </div>
            </div>

            {/* BOTTOM CLOSE BUTTON (NO PRINT) */}
            <div className="mt-6 pt-4 border-t border-slate-200 flex justify-end gap-3 no-print">
              <button
                onClick={onClose}
                className="px-5 py-2 bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold rounded-xl transition flex items-center gap-2 shadow-sm"
              >
                <i className="fas fa-check"></i>
                <span>Cerrar Comprobante</span>
              </button>
            </div>

          </div>
        </div>
      );
    }

    // 11. SECURITY LOCK SCREEN (PROTECCION DE ACCESO)
    function SecurityLockScreen({ onLogin }) {
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [rememberMe, setRememberMe] = useState(true);
      const [error, setError] = useState('');
      const [isLoading, setIsLoading] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        setError('');
        setIsLoading(true);
        setTimeout(() => {
          const res = onLogin(password, rememberMe);
          if (!res.success) {
            setError(res.error || 'Contrasena incorrecta');
            setIsLoading(false);
          }
        }, 150);
      };

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-950 via-emerald-950 to-slate-900 flex items-center justify-center p-4 selection:bg-emerald-500 selection:text-white relative overflow-hidden">
          
          {/* BACKGROUND GLOW DECORATIONS */}
          <div className="absolute -top-40 -left-40 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>
          <div className="absolute -bottom-40 -right-40 w-96 h-96 bg-emerald-600/10 rounded-full blur-3xl pointer-events-none"></div>
          
          {/* CARD */}
          <div className="w-full max-w-md bg-slate-900/85 backdrop-blur-xl border border-emerald-500/30 rounded-3xl p-8 shadow-2xl shadow-emerald-950/60 relative z-10 animate-fade-in">
            
            {/* LOGO & BRAND */}
            <div className="text-center mb-6">
              <div className="w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-400 to-emerald-700 mx-auto flex items-center justify-center text-slate-950 font-black text-3xl shadow-lg shadow-emerald-600/30 mb-4 border border-emerald-300/40">
                <i className="fas fa-seedling"></i>
              </div>
              <h1 className="text-2xl font-black text-white tracking-tight flex items-center justify-center gap-2">
                <span>FUTURE FOOD</span>
                <span className="text-xs bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded border border-emerald-500/30 font-mono">SAS</span>
              </h1>
              <p className="text-xs text-emerald-300/70 mt-1 font-medium">Sistema Interno de Control de Stock y Facturacion</p>
            </div>

            {/* SECURITY PROTOCOL BADGE */}
            <div className="mb-6 p-2.5 bg-emerald-950/70 rounded-xl border border-emerald-500/20 flex items-center justify-center gap-2 text-center text-[11px] text-emerald-300 font-medium">
              <i className="fas fa-shield-halved text-emerald-400 text-sm"></i>
              <span>Acceso Protegido y Encriptado (HTTPS / TLS 1.3)</span>
            </div>

            {/* FORM */}
            <form onSubmit={handleSubmit} className="space-y-5">
              <div>
                <label className="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2 flex justify-between">
                  <span>Contrasena de Seguridad</span>
                  <span className="text-[10px] text-emerald-400/80 font-normal">Requerida</span>
                </label>
                
                <div className="relative">
                  <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                    <i className="fas fa-key text-xs"></i>
                  </div>
                  <input
                    type={showPassword ? 'text' : 'password'}
                    required
                    autoFocus
                    placeholder="Ingrese la clave de acceso..."
                    value={password}
                    onChange={(e) => {
                      setPassword(e.target.value);
                      if (error) setError('');
                    }}
                    className="w-full pl-9 pr-11 py-3 bg-slate-950/70 border border-slate-700/80 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 rounded-xl text-white placeholder-slate-500 text-sm font-mono tracking-wide focus:outline-none transition"
                  />
                  <button
                    type="button"
                    onClick={() => setShowPassword(!showPassword)}
                    className="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-white transition"
                    title={showPassword ? 'Ocultar contrasena' : 'Mostrar contrasena'}
                  >
                    <i className={`fas ${showPassword ? 'fa-eye-slash' : 'fa-eye'} text-xs`}></i>
                  </button>
                </div>
              </div>

              {error && (
                <div className="p-3 bg-rose-950/60 border border-rose-500/50 rounded-xl text-rose-300 text-xs flex items-center gap-2.5 animate-shake">
                  <i className="fas fa-triangle-exclamation text-rose-400 text-sm flex-shrink-0"></i>
                  <span>{error}</span>
                </div>
              )}

              <div className="flex items-center justify-between text-xs">
                <label className="flex items-center gap-2 text-slate-400 hover:text-slate-300 cursor-pointer select-none">
                  <input
                    type="checkbox"
                    checked={rememberMe}
                    onChange={(e) => setRememberMe(e.target.checked)}
                    className="w-4 h-4 rounded bg-slate-950 border-slate-700 text-emerald-600 focus:ring-emerald-500 focus:ring-offset-slate-900"
                  />
                  <span>Recordar sesion en este equipo</span>
                </label>
              </div>

              <button
                type="submit"
                disabled={isLoading || !password}
                className="w-full py-3.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-slate-950 font-black rounded-xl shadow-lg shadow-emerald-900/40 transition flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed text-sm uppercase tracking-wider"
              >
                {isLoading ? (
                  <>
                    <i className="fas fa-circle-notch fa-spin"></i>
                    <span>Verificando Credencial...</span>
                  </>
                ) : (
                  <>
                    <i className="fas fa-unlock"></i>
                    <span>Ingresar al Sistema</span>
                  </>
                )}
              </button>
            </form>

            {/* SECURITY FOOTER NOTE */}
            <div className="mt-8 pt-5 border-t border-slate-800/80 text-center">
              <p className="text-[11px] text-slate-500 leading-relaxed">
                Plataforma corporativa de uso interno. Acceso exclusivo para el equipo de <strong className="text-slate-400">FUTURE FOOD SAS</strong>.
              </p>
            </div>

          </div>

        </div>
      );
    }

    // Render Root
    const rootElement = document.getElementById('root');
    if (rootElement) {
      const root = ReactDOM.createRoot(rootElement);
      root.render(<FutureFoodStockApp />);
    }
  </script>
</body>
</html>
