<body class="bg-slate-50 text-slate-900 antialiased selection:bg-emerald-500 selection:text-white">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // -----------------------------
    // FORMATTERS & UTILS
    // -----------------------------
    const formatCurrency = (val) => {
      const num = Number(val) || 0;
      return '$ ' + num.toLocaleString('es-AR', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    };

    const formatNumber = (val, decimals = 2) => {
      const num = Number(val) || 0;
      return num.toLocaleString('es-AR', {
        minimumFractionDigits: 0,
        maximumFractionDigits: decimals
      });
    };

    const formatDate = (dateString) => {
      if (!dateString) return '-';
      const d = new Date(dateString);
      if (isNaN(d.getTime())) return dateString;
      return d.toLocaleDateString('es-AR', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    };

    const formatDateShort = (dateString) => {
      if (!dateString) return '-';
      const d = new Date(dateString);
      if (isNaN(d.getTime())) return dateString;
      return d.toLocaleDateString('es-AR', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric'
      });
    };

    // Helper to calculate BOM unit cost for a product
    const calculateBomUnitCost = (bom = [], rawMaterials = []) => {
      if (!bom || !Array.isArray(bom)) return 0;
      return bom.reduce((acc, item) => {
        const raw = rawMaterials.find(r => r.id === item.rawMaterialId);
        const unitPrice = raw ? Number(raw.costPrice) || 0 : 0;
        return acc + (unitPrice * (Number(item.quantity) || 0));
      }, 0);
    };

    // Helper to calculate maximum immediate production units based on current stock
    const calculateMaxProduction = (bom = [], rawMaterials = []) => {
      if (!bom || bom.length === 0) return 0;
      let maxPossible = Infinity;
      for (const item of bom) {
        const raw = rawMaterials.find(r => r.id === item.rawMaterialId);
        if (!raw || !item.quantity || Number(item.quantity) <= 0) {
          return 0;
        }
        const possibleForThisRaw = Math.floor(raw.currentStock / item.quantity);
        if (possibleForThisRaw < maxPossible) {
          maxPossible = possibleForThisRaw;
        }
      }
      return maxPossible === Infinity ? 0 : Math.max(0, maxPossible);
    };

    // -----------------------------
    // SECURITY & ACCESS CONTROL
    // -----------------------------
    const ACCESS_PASSWORD = 'CDRCDRJCPAVR2026';
    const AUTH_STORAGE_KEY = 'ff_sas_auth_token';

    // -----------------------------
    // MAIN APP COMPONENT
    // -----------------------------
    function FutureFoodStockApp() {
      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        try {
          const sessionAuth = sessionStorage.getItem(AUTH_STORAGE_KEY);
          if (sessionAuth === 'AUTH_OK_2026') return true;
          const localAuth = localStorage.getItem(AUTH_STORAGE_KEY);
          if (localAuth === 'AUTH_OK_2026') return true;
          return false;
        } catch (e) {
          return false;
        }
      });

      const [activeTab, setActiveTab] = useState('dashboard');
      const [notification, setNotification] = useState(null);

      // Clean States
      const [suppliers, setSuppliers] = useState(() => {
        const saved = localStorage.getItem('ff_sas_suppliers');
        return saved ? JSON.parse(saved) : [];
      });

      const [clients, setClients] = useState(() => {
        const saved = localStorage.getItem('ff_sas_clients');
        return saved ? JSON.parse(saved) : [];
      });

      const [rawMaterials, setRawMaterials] = useState(() => {
        const saved = localStorage.getItem('ff_sas_raw_materials');
        return saved ? JSON.parse(saved) : [];
      });

      const [products, setProducts] = useState(() => {
        const saved = localStorage.getItem('ff_sas_products');
        return saved ? JSON.parse(saved) : [];
      });

      const [transactions, setTransactions] = useState(() => {
        const saved = localStorage.getItem('ff_sas_transactions');
        return saved ? JSON.parse(saved) : [];
      });

      // Modals state
      const [modalState, setModalState] = useState({
        isOpen: false,
        type: null,
        data: null
      });

      // Print voucher / Invoice modal state
      const [printDoc, setPrintDoc] = useState(null);

      // Sync to localStorage
      useEffect(() => {
        localStorage.setItem('ff_sas_suppliers', JSON.stringify(suppliers));
      }, [suppliers]);

      useEffect(() => {
        localStorage.setItem('ff_sas_clients', JSON.stringify(clients));
      }, [clients]);

      useEffect(() => {
        localStorage.setItem('ff_sas_raw_materials', JSON.stringify(rawMaterials));
      }, [rawMaterials]);

      useEffect(() => {
        localStorage.setItem('ff_sas_products', JSON.stringify(products));
      }, [products]);

      useEffect(() => {
        localStorage.setItem('ff_sas_transactions', JSON.stringify(transactions));
      }, [transactions]);

      // Toast notification helper
      const showToast = (message, type = 'success') => {
        setNotification({ message, type, id: Date.now() });
        setTimeout(() => {
          setNotification(null);
        }, 4500);
      };

      // Metrics
      const metrics = useMemo(() => {
        const rawValuation = rawMaterials.reduce((acc, rm) => acc + (Number(rm.currentStock || 0) * Number(rm.costPrice || 0)), 0);
        
        const productsCostValuation = products.reduce((acc, p) => {
          const bomCost = calculateBomUnitCost(p.bom, rawMaterials);
          return acc + (Number(p.currentStock || 0) * bomCost);
        }, 0);

        const productsSaleValuation = products.reduce((acc, p) => acc + (Number(p.currentStock || 0) * Number(p.salePrice || 0)), 0);

        const totalPurchases = transactions
          .filter(t => t.type === 'COMPRA')
          .reduce((acc, t) => acc + (Number(t.totalAmount) || 0), 0);

        const totalSales = transactions
          .filter(t => t.type === 'VENTA')
          .reduce((acc, t) => acc + (Number(t.totalAmount) || 0), 0);

        const totalCreditNotes = transactions
          .filter(t => t.type === 'NOTA_CREDITO')
          .reduce((acc, t) => acc + (Number(t.totalAmount) || 0), 0);

        const totalDebitNotes = transactions
          .filter(t => t.type === 'NOTA_DEBITO')
          .reduce((acc, t) => acc + (Number(t.totalAmount) || 0), 0);

        const netSales = Math.max(0, (totalSales + totalDebitNotes) - totalCreditNotes);

        const totalProductionCost = transactions
          .filter(t => t.type === 'PRODUCCION')
          .reduce((acc, t) => acc + (Number(t.totalCost) || 0), 0);

        const lowStockRawMaterials = rawMaterials.filter(rm => Number(rm.currentStock) <= Number(rm.minStock));
        const lowStockProducts = products.filter(p => Number(p.currentStock) <= Number(p.minStock));

        return {
          rawValuation,
          productsCostValuation,
          productsSaleValuation,
          totalInventoryValuation: rawValuation + productsCostValuation,
          totalPurchases,
          totalSales,
          totalCreditNotes,
          totalDebitNotes,
          netSales,
          totalProductionCost,
          lowStockRawMaterials,
          lowStockProducts,
          totalRawItems: rawMaterials.length,
          totalProductItems: products.length
        };
      }, [rawMaterials, products, transactions]);

      // 1. REGISTRO DE COMPRA (+ Materia Prima / Proveedor)
      const handleRegisterPurchase = (purchaseData) => {
        const { supplierId, referenceNumber, items, notes, updateCosts } = purchaseData;
        const supplier = suppliers.find(s => s.id === supplierId);
        
        if (!supplier) {
          showToast('Debe seleccionar un proveedor valido', 'error');
          return;
        }
        if (!items || items.length === 0) {
          showToast('Debe agregar al menos una materia prima a la compra', 'error');
          return;
        }

        const newCode = 'CMP-' + new Date().getFullYear() + '-' + String(transactions.filter(t => t.type === 'COMPRA').length + 1).padStart(3, '0');
        const totalAmount = items.reduce((acc, it) => acc + (Number(it.quantity) * Number(it.unitPrice)), 0);

        // Update Raw Materials Stock & Cost Prices
        setRawMaterials(prev => {
          return prev.map(rm => {
            const purchased = items.find(it => it.rawMaterialId === rm.id);
            if (purchased) {
              const newStock = Number(rm.currentStock) + Number(purchased.quantity);
              const newCost = updateCosts ? Number(purchased.unitPrice) : rm.costPrice;
              return {
                ...rm,
                currentStock: newStock,
                costPrice: newCost,
                supplierId: supplierId || rm.supplierId
              };
            }
            return rm;
          });
        });

        // Create Transaction Record
        const newTransaction = {
          id: 'TRX-' + Date.now(),
          code: newCode,
          type: 'COMPRA',
          date: new Date().toISOString(),
          entityId: supplier.id,
          entityName: supplier.name,
          entityCuit: supplier.cuit || '',
          entityAddress: supplier.address || '',
          referenceNumber: referenceNumber || 'S/N',
          items: items.map(it => {
            const rm = rawMaterials.find(r => r.id === it.rawMaterialId);
            return {
              id: it.rawMaterialId,
              name: rm ? rm.name : 'Materia Prima',
              quantity: Number(it.quantity),
              unit: rm ? rm.unit : 'Unidad',
              unitPrice: Number(it.unitPrice),
              subtotal: Number(it.quantity) * Number(it.unitPrice)
            };
          }),
          totalAmount,
          notes: notes || 'Entrada de almacen por compra de materias primas'
        };

        setTransactions(prev => [newTransaction, ...prev]);
        showToast('Compra ' + newCode + ' registrada correctamente.');
        setModalState({ isOpen: false, type: null, data: null });
        setPrintDoc(newTransaction);
      };

      // 2. REGISTRO DE PRODUCCION (- Materias Primas / + Mercaderias Multiples)
      const handleRegisterProduction = (prodData) => {
        const { batchNumber, notes } = prodData;
        const rawItems = prodData.items || (prodData.productId ? [{ productId: prodData.productId, quantity: prodData.quantity }] : []);
        
        // Filter valid items
        const validItems = rawItems.filter(it => it.productId && Number(it.quantity) > 0);

        if (validItems.length === 0) {
          showToast('Agregue al menos una mercaderia con cantidad mayor a cero para fabricar', 'error');
          return;
        }

        // Validate products and their BOMs
        const producedItems = [];
        const totalMaterialsNeeded = {};

        for (const it of validItems) {
          const prod = products.find(p => p.id === it.productId);
          const qty = Number(it.quantity);

          if (!prod) {
            showToast('Una de las mercaderias seleccionadas no es valida', 'error');
            return;
          }

          if (!prod.bom || prod.bom.length === 0) {
            showToast(`La mercaderia "${prod.name}" no tiene materias primas en su receta BOM`, 'error');
            return;
          }

          producedItems.push({
            productId: prod.id,
            productName: prod.name,
            quantity: qty,
            unit: 'u'
          });

          for (const bomItem of prod.bom) {
            const rm = rawMaterials.find(r => r.id === bomItem.rawMaterialId);
            const neededForThis = (Number(bomItem.quantity) || 0) * qty;
            
            if (!totalMaterialsNeeded[bomItem.rawMaterialId]) {
              totalMaterialsNeeded[bomItem.rawMaterialId] = {
                rawMaterialId: bomItem.rawMaterialId,
                name: rm ? rm.name : 'MP no encontrada',
                unit: rm ? rm.unit : 'u',
                requiredQty: 0,
                unitCost: rm ? rm.costPrice : 0
              };
            }
            totalMaterialsNeeded[bomItem.rawMaterialId].requiredQty += neededForThis;
          }
        }

        // Strict validation: check raw material availability
        const missingMaterials = [];
        for (const rmId in totalMaterialsNeeded) {
          const mat = totalMaterialsNeeded[rmId];
          const rm = rawMaterials.find(r => r.id === rmId);
          const available = rm ? rm.currentStock : 0;
          if (available < mat.requiredQty) {
            missingMaterials.push({
              name: mat.name,
              required: mat.requiredQty,
              available: available,
              unit: mat.unit
            });
          }
        }

        if (missingMaterials.length > 0) {
          const msg = 'Stock insuficiente de materias primas para la orden de produccion:\n' + 
            missingMaterials.map(m => '• ' + m.name + ': Requiere ' + formatNumber(m.required, 3) + ' ' + m.unit + ', Disponible: ' + formatNumber(m.available, 3) + ' ' + m.unit).join('\n');
          alert(msg);
          return;
        }

        // Deduct Raw Materials from Stock
        const consumedMaterials = [];
        let totalCost = 0;

        setRawMaterials(prev => {
          return prev.map(rm => {
            const needed = totalMaterialsNeeded[rm.id];
            if (needed && needed.requiredQty > 0) {
              const subtotalCost = needed.requiredQty * rm.costPrice;
              totalCost += subtotalCost;
              consumedMaterials.push({
                rawMaterialId: rm.id,
                name: rm.name,
                quantity: needed.requiredQty,
                unit: rm.unit,
                unitCost: rm.costPrice,
                subtotal: subtotalCost
              });
              return {
                ...rm,
                currentStock: Math.max(0, rm.currentStock - needed.requiredQty)
              };
            }
            return rm;
          });
        });

        // Add Produced Goods to Product Stock
        setProducts(prev => {
          return prev.map(p => {
            const produced = producedItems.find(it => it.productId === p.id);
            if (produced) {
              return {
                ...p,
                currentStock: Number(p.currentStock) + Number(produced.quantity)
              };
            }
            return p;
          });
        });

        const totalProducedQty = producedItems.reduce((acc, it) => acc + it.quantity, 0);
        const productSummary = producedItems.map(p => `${formatNumber(p.quantity)} u de ${p.productName}`).join(' + ');
        const newCode = 'PRD-' + new Date().getFullYear() + '-' + String(transactions.filter(t => t.type === 'PRODUCCION').length + 1).padStart(3, '0');
        const unitCost = totalProducedQty > 0 ? (totalCost / totalProducedQty) : 0;

        const newTransaction = {
          id: 'TRX-' + Date.now(),
          code: newCode,
          type: 'PRODUCCION',
          date: new Date().toISOString(),
          productId: producedItems[0]?.productId || '',
          productName: productSummary,
          producedItems: producedItems,
          quantityProduced: totalProducedQty,
          batchNumber: batchNumber || 'LOTE-' + Date.now().toString().slice(-6),
          consumedMaterials,
          totalCost,
          unitCost,
          notes: notes || 'Fabricacion ejecutada de acuerdo a formula'
        };

        setTransactions(prev => [newTransaction, ...prev]);
        showToast('Orden de Produccion exitosa: ' + productSummary + '.');
        setModalState({ isOpen: false, type: null, data: null });
        setPrintDoc(newTransaction);
      };

      // 3. REGISTRO DE VENTA (- Mercaderia / Cliente) + GENERACION DE FACTURA A
      const handleRegisterSale = (saleData) => {
        const { clientId, invoiceType, invoiceNumber, pointOfSale, invoiceSeq, referenceNumber, items, notes } = saleData;
        const client = clients.find(c => c.id === clientId);

        if (!client) {
          showToast('Seleccione un cliente valido para la venta', 'error');
          return;
        }
        if (!items || items.length === 0) {
          showToast('Agregue al menos una mercaderia a la venta', 'error');
          return;
        }

        // Validate stock for all sold products
        const insufficientStock = [];
        for (const item of items) {
          const prod = products.find(p => p.id === item.productId);
          const qtyToSell = Number(item.quantity);
          if (!prod || prod.currentStock < qtyToSell) {
            insufficientStock.push({
              name: prod ? prod.name : 'Mercaderia',
              requested: qtyToSell,
              available: prod ? prod.currentStock : 0
            });
          }
        }

        if (insufficientStock.length > 0) {
          const msg = 'Stock insuficiente de mercaderia para la venta:\n' +
            insufficientStock.map(m => '• ' + m.name + ': Solicitado: ' + m.requested + ' u, Disponible: ' + m.available + ' u').join('\n');
          alert(msg);
          return;
        }

        // Deduct Finished Goods from Stock
        setProducts(prev => {
          return prev.map(p => {
            const soldItem = items.find(it => it.productId === p.id);
            if (soldItem) {
              return {
                ...p,
                currentStock: p.currentStock - Number(soldItem.quantity)
              };
            }
            return p;
          });
        });

        const nextNum = transactions.filter(t => t.type === 'VENTA').length + 1;
        const finalInvoiceNum = invoiceNumber || ('A-0001-' + String(nextNum).padStart(8, '0'));
        const newCode = 'VTA-' + new Date().getFullYear() + '-' + String(nextNum).padStart(3, '0');
        const totalAmount = items.reduce((acc, it) => acc + (Number(it.quantity) * Number(it.unitPrice)), 0);
        const netAmount = Math.round((totalAmount / 1.21) * 100) / 100;
        const ivaAmount = Math.round((totalAmount - netAmount) * 100) / 100;
        const randomCAE = '7' + Math.floor(1000000000000 + Math.random() * 9000000000000);
        const caeVtoDate = new Date(Date.now() + 10 * 24 * 60 * 60 * 1000).toISOString().slice(0, 10);

        const newTransaction = {
          id: 'TRX-' + Date.now(),
          code: newCode,
          invoiceNumber: finalInvoiceNum,
          voucherType: invoiceType || 'FACTURA A',
          invoiceLetter: 'A',
          invoiceCode: '01',
          pointOfSale: pointOfSale || '0001',
          invoiceSeq: invoiceSeq || String(nextNum).padStart(8, '0'),
          type: 'VENTA',
          date: new Date().toISOString(),
          entityId: client.id,
          entityName: client.name,
          entityCuit: client.cuit || '',
          entityAddress: client.address || '',
          entityPhone: client.phone || '',
          entityEmail: client.email || '',
          entityIvaCond: 'IVA Responsable Inscripto',
          referenceNumber: referenceNumber || finalInvoiceNum,
          items: items.map(it => {
            const prod = products.find(p => p.id === it.productId);
            const qty = Number(it.quantity);
            const price = Number(it.unitPrice);
            const itemTotal = qty * price;
            const itemNet = Math.round((itemTotal / 1.21) * 100) / 100;
            const itemUnitNet = Math.round((price / 1.21) * 100) / 100;
            return {
              id: it.productId,
              code: prod ? prod.code : 'M-001',
              name: prod ? prod.name : 'Mercaderia',
              unit: 'u',
              quantity: qty,
              unitPrice: price,
              unitPriceNet: itemUnitNet,
              ivaRate: 21,
              subtotalNet: itemNet,
              subtotal: itemTotal
            };
          }),
          netAmount,
          ivaRate: 21,
          ivaAmount,
          totalAmount,
          cae: randomCAE,
          caeVto: caeVtoDate,
          notes: notes || 'Venta de mercaderia despachada'
        };

        // Update transactions state (registers synchronously in Ventas y Facturas + Libro Diario / Kardex)
        setTransactions(prev => [newTransaction, ...prev]);
        showToast('Factura A ' + finalInvoiceNum + ' emitida y registrada a ' + client.name);
        setModalState({ isOpen: false, type: null, data: null });
        
        // Auto open Invoice Factura A modal for instant PDF / Print
        setPrintDoc(newTransaction);
      };

      // 4. REGISTRO DE NOTA DE CREDITO O DEBITO AFIP (ANULACIONES, DEVOLUCIONES, RECARGOS)
      const handleRegisterCreditDebitNote = (noteData) => {
        const {
          noteType,
          invoiceLetter,
          pointOfSale,
          noteSeq,
          noteNumber,
          associatedInvoiceId,
          associatedInvoiceNumber,
          clientId,
          reason,
          returnStock,
          items,
          notes
        } = noteData;

        const client = clients.find(c => c.id === clientId);
        if (!client) {
          showToast('Seleccione un cliente valido', 'error');
          return;
        }
        if (!items || items.length === 0) {
          showToast('Agregue al menos un item o concepto a la nota', 'error');
          return;
        }

        // Si es Nota de Credito con reingreso de stock (+ reingreso de mercaderias devueltas)
        if (noteType === 'NOTA_CREDITO' && returnStock) {
          setProducts(prev => {
            return prev.map(p => {
              const returnedItem = items.find(it => it.productId === p.id);
              if (returnedItem && Number(returnedItem.quantity) > 0) {
                return {
                  ...p,
                  currentStock: p.currentStock + Number(returnedItem.quantity)
                };
              }
              return p;
            });
          });
        }

        // Si es Nota de Debito con salida de stock (- despacho de mercaderia adicional)
        if (noteType === 'NOTA_DEBITO' && returnStock) {
          const insufficientStock = [];
          for (const item of items) {
            if (item.productId) {
              const prod = products.find(p => p.id === item.productId);
              const qty = Number(item.quantity);
              if (!prod || prod.currentStock < qty) {
                insufficientStock.push({
                  name: prod ? prod.name : 'Mercaderia',
                  requested: qty,
                  available: prod ? prod.currentStock : 0
                });
              }
            }
          }
          if (insufficientStock.length > 0) {
            const msg = 'Stock insuficiente de mercaderia para debitar:\n' +
              insufficientStock.map(m => '• ' + m.name + ': Solicitado: ' + m.requested + ' u, Disponible: ' + m.available + ' u').join('\n');
            alert(msg);
            return;
          }

          setProducts(prev => {
            return prev.map(p => {
              const debitedItem = items.find(it => it.productId === p.id);
              if (debitedItem && Number(debitedItem.quantity) > 0) {
                return {
                  ...p,
                  currentStock: p.currentStock - Number(debitedItem.quantity)
                };
              }
              return p;
            });
          });
        }

        const totalAmount = items.reduce((acc, it) => acc + (Number(it.quantity) * Number(it.unitPrice)), 0);
        const netAmount = Math.round((totalAmount / 1.21) * 100) / 100;
        const ivaAmount = Math.round((totalAmount - netAmount) * 100) / 100;
        const randomCAE = '7' + Math.floor(1000000000000 + Math.random() * 9000000000000);
        const caeVtoDate = new Date(Date.now() + 10 * 24 * 60 * 60 * 1000).toISOString().slice(0, 10);

        const countType = transactions.filter(t => t.type === noteType).length + 1;
        const prefix = noteType === 'NOTA_CREDITO' ? 'NC' : 'ND';
        const newCode = `${prefix}-${new Date().getFullYear()}-${String(countType).padStart(3, '0')}`;
        const afipCode = noteType === 'NOTA_CREDITO' ? '03' : '02';
        const voucherTitle = noteType === 'NOTA_CREDITO' ? 'NOTA DE CREDITO A' : 'NOTA DE DEBITO A';
        const finalNoteNumber = noteNumber || `${prefix}-${invoiceLetter || 'A'}-${pointOfSale || '0001'}-${String(countType).padStart(8, '0')}`;

        const newTransaction = {
          id: 'TRX-' + Date.now(),
          code: newCode,
          type: noteType,
          voucherType: voucherTitle,
          invoiceLetter: invoiceLetter || 'A',
          invoiceCode: afipCode,
          pointOfSale: pointOfSale || '0001',
          invoiceSeq: noteSeq || String(countType).padStart(8, '0'),
          invoiceNumber: finalNoteNumber,
          associatedInvoiceId: associatedInvoiceId || '',
          associatedInvoiceNumber: associatedInvoiceNumber || '',
          reason: reason || 'Ajuste comercial / contable',
          returnStock: Boolean(returnStock),
          date: new Date().toISOString(),
          entityId: client.id,
          entityName: client.name,
          entityCuit: client.cuit || '',
          entityAddress: client.address || '',
          entityPhone: client.phone || '',
          entityEmail: client.email || '',
          entityIvaCond: 'IVA Responsable Inscripto',
          referenceNumber: associatedInvoiceNumber || newCode,
          items: items.map(it => {
            const prod = products.find(p => p.id === it.productId);
            const qty = Number(it.quantity) || 1;
            const price = Number(it.unitPrice) || 0;
            const itemTotal = qty * price;
            const itemNet = Math.round((itemTotal / 1.21) * 100) / 100;
            const itemUnitNet = Math.round((price / 1.21) * 100) / 100;
            return {
              id: it.productId || 'item-concept',
              code: prod ? prod.code : (it.code || 'CNC-01'),
              name: it.name || (prod ? prod.name : 'Concepto Facturado'),
              unit: prod ? 'u' : (it.unit || 'u'),
              quantity: qty,
              unitPrice: price,
              unitPriceNet: itemUnitNet,
              ivaRate: 21,
              subtotalNet: itemNet,
              subtotal: itemTotal
            };
          }),
          netAmount,
          ivaRate: 21,
          ivaAmount,
          totalAmount,
          cae: randomCAE,
          caeVto: caeVtoDate,
          notes: notes || ''
        };

        // Update state and register in Libro Diario + Notas
        setTransactions(prev => [newTransaction, ...prev]);
        showToast(`${voucherTitle} ${finalNoteNumber} emitida y registrada a ${client.name}`);
        setModalState({ isOpen: false, type: null, data: null });
        setPrintDoc(newTransaction);
      };

      // CRUD RAW MATERIALS
      const handleSaveRawMaterial = (formData) => {
        if (modalState.type === 'editRawMaterial') {
          setRawMaterials(prev => prev.map(rm => rm.id === formData.id ? { ...rm, ...formData } : rm));
          showToast('Materia prima "' + formData.name + '" actualizada.');
        } else {
          const newId = 'MP-' + String(rawMaterials.length + 1).padStart(3, '0');
          const newCode = formData.code || 'MP-' + String(rawMaterials.length + 1).padStart(3, '0');
          const newRM = {
            ...formData,
            id: newId,
            code: newCode,
            currentStock: Number(formData.currentStock) || 0,
            costPrice: Number(formData.costPrice) || 0,
            minStock: Number(formData.minStock) || 0
          };
          setRawMaterials(prev => [...prev, newRM]);
          showToast('Materia prima "' + formData.name + '" dada de alta.');
        }
        setModalState({ isOpen: false, type: null, data: null });
      };

      const handleDeleteRawMaterial = (id) => {
        const isUsedInBom = products.some(p => p.bom && p.bom.some(b => b.rawMaterialId === id));
        if (isUsedInBom) {
          alert('No se puede eliminar esta materia prima porque esta asignada en el check list de una o mas mercaderias.');
          return;
        }
        if (confirm('Esta seguro de eliminar esta materia prima del catalogo?')) {
          setRawMaterials(prev => prev.filter(rm => rm.id !== id));
          showToast('Materia prima eliminada del catalogo.', 'info');
        }
      };

      // CRUD PRODUCTS
      const handleSaveProduct = (formData) => {
        if (modalState.type === 'editProduct') {
          setProducts(prev => prev.map(p => p.id === formData.id ? { ...p, ...formData } : p));
          showToast('Mercaderia "' + formData.name + '" actualizada.');
        } else {
          const newId = 'PT-' + String(products.length + 1).padStart(3, '0');
          const newCode = formData.code || 'PT-' + String(products.length + 1).padStart(3, '0');
          const newProd = {
            ...formData,
            id: newId,
            code: newCode,
            salePrice: Number(formData.salePrice) || 0,
            currentStock: Number(formData.currentStock) || 0,
            minStock: Number(formData.minStock) || 0,
            bom: formData.bom || []
          };
          setProducts(prev => [...prev, newProd]);
          showToast('Mercaderia "' + formData.name + '" registrada con su check list BOM.');
        }
        setModalState({ isOpen: false, type: null, data: null });
      };

      const handleDeleteProduct = (id) => {
        if (confirm('Esta seguro de eliminar esta mercaderia del catalogo?')) {
          setProducts(prev => prev.filter(p => p.id !== id));
          showToast('Mercaderia eliminada del catalogo.', 'info');
        }
      };

      // CRUD SUPPLIERS & CLIENTS
      const handleSaveSupplier = (formData) => {
        if (modalState.type === 'editSupplier') {
          setSuppliers(prev => prev.map(s => s.id === formData.id ? { ...s, ...formData } : s));
          showToast('Proveedor "' + formData.name + '" actualizado.');
        } else {
          const newId = 'PROV-' + String(suppliers.length + 1).padStart(3, '0');
          setSuppliers(prev => [...prev, { ...formData, id: newId }]);
          showToast('Proveedor "' + formData.name + '" registrado.');
        }
        setModalState({ isOpen: false, type: null, data: null });
      };

      const handleSaveClient = (formData) => {
        if (modalState.type === 'editClient') {
          setClients(prev => prev.map(c => c.id === formData.id ? { ...c, ...formData } : c));
          showToast('Cliente "' + formData.name + '" actualizado.');
        } else {
          const newId = 'CLI-' + String(clients.length + 1).padStart(3, '0');
          setClients(prev => [...prev, { ...formData, id: newId }]);
          showToast('Cliente "' + formData.name + '" registrado.');
        }
        setModalState({ isOpen: false, type: null, data: null });
      };

      // QUICK STOCK ADJUSTMENT
      const handleQuickAdjust = ({ type, id, newStock, reason }) => {
        const qty = Number(newStock);
        if (type === 'MP') {
          const rm = rawMaterials.find(r => r.id === id);
          if (!rm) return;
          const diff = qty - rm.currentStock;
          setRawMaterials(prev => prev.map(r => r.id === id ? { ...r, currentStock: qty } : r));
          
          const newTransaction = {
            id: 'TRX-' + Date.now(),
            code: 'AJU-' + Date.now().toString().slice(-4),
            type: 'AJUSTE',
            date: new Date().toISOString(),
            entityName: 'Auditoria Interna',
            items: [{ id: rm.id, name: rm.name, quantity: diff, unit: rm.unit, unitPrice: rm.costPrice, subtotal: diff * rm.costPrice }],
            totalAmount: Math.abs(diff * rm.costPrice),
            notes: 'Ajuste inventario fisico MP: ' + (reason || 'Recuento manual')
          };
          setTransactions(prev => [newTransaction, ...prev]);
          showToast('Stock de "' + rm.name + '" ajustado a ' + qty + ' ' + rm.unit);
        } else {
          const prod = products.find(p => p.id === id);
          if (!prod) return;
          const diff = qty - prod.currentStock;
          setProducts(prev => prev.map(p => p.id === id ? { ...p, currentStock: qty } : p));
          
          const newTransaction = {
            id: 'TRX-' + Date.now(),
            code: 'AJU-' + Date.now().toString().slice(-4),
            type: 'AJUSTE',
            date: new Date().toISOString(),
            entityName: 'Auditoria Interna',
            items: [{ id: prod.id, name: prod.name, quantity: diff, unit: 'u', unitPrice: prod.salePrice, subtotal: diff * prod.salePrice }],
            totalAmount: Math.abs(diff * prod.salePrice),
            notes: 'Ajuste inventario fisico Mercaderia: ' + (reason || 'Recuento manual')
          };
          setTransactions(prev => [newTransaction, ...prev]);
          showToast('Stock de "' + prod.name + '" ajustado a ' + qty + ' u.');
        }
        setModalState({ isOpen: false, type: null, data: null });
      };

      // EXPORT TO EXCEL
      const handleExportExcel = () => {
        if (typeof XLSX === 'undefined') {
          showToast('Libreria de exportacion no cargada', 'error');
          return;
        }
        try {
          const wb = XLSX.utils.book_new();

          // Sheet 1: Raw Materials
          const rmData = rawMaterials.map(rm => {
            const supp = suppliers.find(s => s.id === rm.supplierId);
            return {
              'Codigo': rm.code,
              'Materia Prima': rm.name,
              'Categoria': rm.category || '-',
              'Unidad': rm.unit,
              'Costo Unitario ($)': rm.costPrice,
              'Stock Actual': rm.currentStock,
              'Stock Minimo': rm.minStock,
              'Valor Total Stock ($)': rm.currentStock * rm.costPrice,
              'Proveedor Habitual': supp ? supp.name : '-',
              'CUIT Proveedor': supp ? supp.cuit : '-'
            };
          });
          const wsRM = XLSX.utils.json_to_sheet(rmData);
          XLSX.utils.book_append_sheet(wb, wsRM, 'Materias Primas');

          // Sheet 2: Products
          const prodData = products.map(p => {
            const bomCost = calculateBomUnitCost(p.bom, rawMaterials);
            const margin = p.salePrice > 0 ? ((p.salePrice - bomCost) / p.salePrice * 100).toFixed(1) : '0';
            const maxProd = calculateMaxProduction(p.bom, rawMaterials);
            return {
              'Codigo': p.code,
              'Mercaderia': p.name,
              'Categoria': p.category || '-',
              'Precio Venta ($)': p.salePrice,
              'Costo Prod. BOM ($)': bomCost,
              'Margen Bruto (%)': margin + '%',
              'Stock Actual': p.currentStock,
              'Capacidad Fab. Inmediata': maxProd,
              'Valorizado Stock Venta ($)': p.currentStock * p.salePrice
            };
          });
          const wsProd = XLSX.utils.json_to_sheet(prodData);
          XLSX.utils.book_append_sheet(wb, wsProd, 'Mercaderias');

          // Sheet 3: Transactions / Sales & Invoices
          const trxData = transactions.map(t => ({
            'Codigo Mov.': t.code,
            'Nro Factura / Ref': t.invoiceNumber || t.referenceNumber || t.batchNumber || '-',
            'Tipo': t.type,
            'Fecha': formatDate(t.date),
            'Contraparte / Detalle': t.entityName || t.productName || '-',
            'Total ($)': t.totalAmount || t.totalCost || 0,
            'Observaciones': t.notes || ''
          }));
          const wsTrx = XLSX.utils.json_to_sheet(trxData);
          XLSX.utils.book_append_sheet(wb, wsTrx, 'Libro Diario y Facturas');

          XLSX.writeFile(wb, 'FUTURE_FOOD_SAS_Inventario_' + new Date().toISOString().slice(0,10) + '.xlsx');
          showToast('Planilla Excel generada y descargada.');
        } catch (err) {
          console.error(err);
          showToast('Error al generar archivo Excel', 'error');
        }
      };

      // BACKUP & RESTORE
      const handleExportJSON = () => {
        const data = {
          backupDate: new Date().toISOString(),
          company: 'FUTURE FOOD SAS',
          suppliers,
          clients,
          rawMaterials,
          products,
          transactions
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'backup_futurefood_sas_' + new Date().toISOString().slice(0,10) + '.json';
        a.click();
        URL.revokeObjectURL(url);
        showToast('Copia de respaldo JSON exportada.');
      };

      const handleImportJSON = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = JSON.parse(evt.target.result);
            if (data.suppliers && data.rawMaterials && data.products) {
              if (confirm('Desea restaurar este respaldo? Se sobrescribiran los datos actuales.')) {
                setSuppliers(data.suppliers || []);
                setClients(data.clients || []);
                setRawMaterials(data.rawMaterials || []);
                setProducts(data.products || []);
                setTransactions(data.transactions || []);
                showToast('Datos restaurados desde el archivo de respaldo.');
                setModalState({ isOpen: false, type: null, data: null });
              }
            } else {
              alert('El archivo no posee el formato de respaldo de Future Food SAS.');
            }
          } catch (err) {
            alert('Error al leer el archivo JSON: ' + err.message);
          }
        };
        reader.readAsText(file);
      };

      const handleLogin = (enteredPassword, rememberMe) => {
        if (enteredPassword && enteredPassword.trim() === ACCESS_PASSWORD) {
          try {
            if (rememberMe) {
              localStorage.setItem(AUTH_STORAGE_KEY, 'AUTH_OK_2026');
            } else {
              sessionStorage.setItem(AUTH_STORAGE_KEY, 'AUTH_OK_2026');
            }
          } catch (e) {}
          setIsAuthenticated(true);
          showToast('Acceso autorizado. Bienvenido a Future Food SAS');
          return { success: true };
        } else {
          return { success: false, error: 'Contrasena incorrecta. Verifique e intente nuevamente.' };
        }
      };

      const handleLogout = () => {
        try {
          sessionStorage.removeItem(AUTH_STORAGE_KEY);
          localStorage.removeItem(AUTH_STORAGE_KEY);
        } catch (e) {}
        setIsAuthenticated(false);
        showToast('Sistema bloqueado. Sesion cerrada con seguridad.', 'info');
      };

      const handleClearAllData = () => {
        if (confirm('Esta seguro de vaciar todos los registros del sistema? Esta accion no se puede deshacer.')) {
          setSuppliers([]);
          setClients([]);
          setRawMaterials([]);
          setProducts([]);
          setTransactions([]);
          localStorage.removeItem('ff_sas_suppliers');
          localStorage.removeItem('ff_sas_clients');
          localStorage.removeItem('ff_sas_raw_materials');
          localStorage.removeItem('ff_sas_products');
          localStorage.removeItem('ff_sas_transactions');
          showToast('Base de datos vaciada. El sistema esta en blanco.', 'info');
        }
      };

      // If user has not entered the access password, show the security lock screen
      if (!isAuthenticated) {
        return (
          <>
            {notification && (
              <div className="fixed bottom-5 right-5 z-50 animate-fade-in">
                <div className={`flex items-center gap-3 px-5 py-3.5 rounded-xl shadow-2xl text-white font-medium ${
                  notification.type === 'error' ? 'bg-rose-600' :
                  notification.type === 'info' ? 'bg-sky-600' : 'bg-emerald-600'
                }`}>
                  <i className={`fas ${notification.type === 'error' ? 'fa-exclamation-triangle' : notification.type === 'info' ? 'fa-info-circle' : 'fa-check-circle'} text-lg`}></i>
                  <span className="text-sm">{notification.message}</span>
                </div>
              </div>
            )}
            <SecurityLockScreen onLogin={handleLogin} />
          </>
        );
      }

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-900">
          {notification && (
            <div className="fixed bottom-5 right-5 z-50 animate-fade-in">
              <div className={`flex items-center gap-3 px-5 py-3.5 rounded-xl shadow-2xl text-white font-medium ${
                notification.type === 'error' ? 'bg-rose-600' :
                notification.type === 'info' ? 'bg-sky-600' : 'bg-emerald-600'
              }`}>
                <i className={`fas ${notification.type === 'error' ? 'fa-exclamation-triangle' : notification.type === 'info' ? 'fa-info-circle' : 'fa-check-circle'} text-lg`}></i>
                <span className="text-sm">{notification.message}</span>
              </div>
            </div>
          )}

          {/* TOP HEADER */}
          <header className="bg-emerald-900 text-white shadow-lg sticky top-0 z-30 border-b border-emerald-800">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16">
                
                {/* BRAND */}
                <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab('dashboard')}>
                  <div className="w-10 h-10 rounded-xl bg-emerald-500 flex items-center justify-center text-emerald-950 font-black text-xl shadow-md">
                    <i className="fas fa-seedling"></i>
                  </div>
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="text-lg font-extrabold tracking-tight text-white">FUTURE FOOD</span>
                      <span className="text-xs bg-emerald-700/80 text-emerald-200 px-2 py-0.5 rounded font-mono font-semibold">SAS</span>
                    </div>
                    <p className="text-[11px] text-emerald-200 font-medium">Control de Stock, Produccion y Facturacion</p>
                  </div>
                </div>

                {/* TOP ACTIONS */}
                <div className="flex items-center space-x-2">
                  <button 
                    onClick={() => {
                      if (suppliers.length === 0 || rawMaterials.length === 0) {
                        alert('Para registrar una compra, primero registre al menos un Proveedor y una Materia Prima en el sistema.');
                        return;
                      }
                      setModalState({ isOpen: true, type: 'newPurchase', data: null });
                    }}
                    className="hidden sm:inline-flex items-center gap-2 px-3 py-1.5 bg-emerald-700 hover:bg-emerald-600 text-white text-xs font-semibold rounded-lg transition shadow-sm"
                    title="Registrar Compra de Materia Prima a Proveedor"
                  >
                    <i className="fas fa-cart-plus text-emerald-300"></i>
                    <span>+ Compra MP</span>
                  </button>

                  <button 
                    onClick={() => {
                      if (products.length === 0) {
                        alert('Para fabricar, primero registre al menos una Mercaderia con su check list BOM.');
                        return;
                      }
                      setModalState({ isOpen: true, type: 'newProduction', data: null });
                    }}
                    className="hidden sm:inline-flex items-center gap-2 px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold rounded-lg transition shadow-sm"
                    title="Registrar Orden de Produccion"
                  >
                    <i className="fas fa-industry text-amber-200"></i>
                    <span>Fabricar</span>
                  </button>

                  <button 
                    onClick={() => {
                      if (clients.length === 0 || products.length === 0) {
                        alert('Para registrar una venta y generar factura, primero registre al menos un Cliente y una Mercaderia con stock.');
                        return;
                      }
                      setModalState({ isOpen: true, type: 'newSale', data: null });
                    }}
                    className="hidden sm:inline-flex items-center gap-2 px-3 py-1.5 bg-sky-600 hover:bg-sky-500 text-white text-xs font-semibold rounded-lg transition shadow-sm"
                    title="Registrar Venta y Generar Factura"
                  >
                    <i className="fas fa-receipt text-sky-200"></i>
                    <span>+ Venta / Facturar</span>
                  </button>

                  <button 
                    onClick={() => {
                      if (clients.length === 0) {
                        alert('Para emitir una Nota de Credito o Debito, primero registre al menos un Cliente.');
                        return;
                      }
                      setModalState({ isOpen: true, type: 'newCreditDebitNote', data: null });
                    }}
                    className="hidden sm:inline-flex items-center gap-2 px-3 py-1.5 bg-rose-700 hover:bg-rose-600 text-white text-xs font-semibold rounded-lg transition shadow-sm"
                    title="Emitir Nota de Credito o Debito AFIP"
                  >
                    <i className="fas fa-file-circle-minus text-rose-200"></i>
                    <span>+ Nota C/D</span>
                  </button>

                  <div className="h-6 w-px bg-emerald-800 mx-1"></div>

                  <button
                    onClick={handleExportExcel}
                    className="p-2 text-emerald-200 hover:text-white hover:bg-emerald-800 rounded-lg transition"
                    title="Exportar Todo a Excel (.XLSX)"
                  >
                    <i className="fas fa-file-excel text-lg text-emerald-400"></i>
                  </button>

                  <button
                    onClick={() => setModalState({ isOpen: true, type: 'backupRestore', data: null })}
                    className="p-2 text-emerald-200 hover:text-white hover:bg-emerald-800 rounded-lg transition"
                    title="Copias de Seguridad (Backup / Restore)"
                  >
                    <i className="fas fa-database text-lg"></i>
                  </button>

                  <button
                    onClick={handleLogout}
                    className="p-2 text-emerald-200 hover:text-rose-200 hover:bg-rose-900/60 rounded-lg transition ml-1"
                    title="Bloquear Sistema y Cerrar Sesion"
                  >
                    <i className="fas fa-lock text-lg"></i>
                  </button>
                </div>

              </div>
            </div>

            {/* NAVIGATION TABS */}
            <div className="bg-emerald-950/90 border-t border-emerald-800/60 overflow-x-auto">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-1 py-1.5 min-w-max">
                
                <button
                  onClick={() => setActiveTab('dashboard')}

                      ? 'bg-emerald-600 text-white shadow-sm' 
                      : 'text-emerald-200 hover:bg-emerald-900 hover:text-white'
                  }`}
                >
                  <i className="fas fa-truck-ramp-box"></i>
                  <span>Entradas (Compras MP)</span>
                </button>

                <button
                  onClick={() => setActiveTab('production')}
                  className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-2 ${
                    activeTab === 'production' 
                      ? 'bg-emerald-600 text-white shadow-sm' 
                      : 'text-emerald-200 hover:bg-emerald-900 hover:text-white'
                  }`}
                >
                  <i className="fas fa-industry"></i>
                  <span>Produccion (-MP / +PT)</span>
                </button>

                <button
                  onClick={() => setActiveTab('sales')}
                  className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-2 ${

                      : 'text-emerald-200 hover:bg-emerald-900 hover:text-white'

                      : 'text-emerald-200 hover:bg-emerald-900 hover:text-white'

                    </span>
                  )}

                <button
                  onClick={() => setActiveTab('entities')}
                  className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-2 ${

                  <span>Proveedores y Clientes</span>

                transactions={transactions}
                suppliers={suppliers}
                clients={clients}

                onNavigateTab={setActiveTab}

              <RawMaterialsView 
                rawMaterials={rawMaterials}
                suppliers={suppliers}
                onOpenModal={(type, data) => setModalState({ isOpen: true, type, data })}
                onDelete={handleDeleteRawMaterial}
              />

              <ProductsView 
                products={products}
                rawMaterials={rawMaterials}
                suppliers={suppliers}
                onOpenModal={(type, data) => setModalState({ isOpen: true, type, data })}
                onDelete={handleDeleteProduct}
              />

            {activeTab === 'purchases' && (
              <PurchasesView 
                transactions={transactions.filter(t => t.type === 'COMPRA')}

                    alert('Para registrar una compra, primero registre al menos un Proveedor y una Materia Prima.');
                    return;
                  }
                  setModalState({ isOpen: true, type: 'newPurchase', data: null });
                }}
                onViewVoucher={(tx) => setPrintDoc(tx)}
              />
            )}

            {activeTab === 'production' && (
              <ProductionView 
                transactions={transactions.filter(t => t.type === 'PRODUCCION')}
                products={products}
                rawMaterials={rawMaterials}
                suppliers={suppliers}
                onOpenNewProduction={() => {
                  if (products.length === 0) {
                    alert('Para fabricar, primero registre al menos una Mercaderia con su check list BOM.');
                    return;
                  }
                  setModalState({ isOpen: true, type: 'newProduction', data: null });
                }}
                onViewVoucher={(tx) => setPrintDoc(tx)}
              />
            )}

            {activeTab === 'sales' && (
              <SalesView 
                transactions={transactions.filter(t => t.type === 'VENTA')}
                clients={clients}
                products={products}
                onOpenNewSale={() => {
                  if (clients.length === 0 || products.length === 0) {
                    alert('Para registrar una venta, primero registre al menos un Cliente y una Mercaderia con stock.');
                    return;
                  }
                  setModalState({ isOpen: true, type: 'newSale', data: null });
                }}
                onOpenNewNote={(initialData) => {
                  setModalState({ isOpen: true, type: 'newCreditDebitNote', data: initialData });
                }}
                onViewVoucher={(tx) => setPrintDoc(tx)}
              />
            )}

            {activeTab === 'creditDebitNotes' && (
              <CreditDebitNotesView 
                transactions={transactions.filter(t => t.type === 'NOTA_CREDITO' || t.type === 'NOTA_DEBITO')}
                allSales={transactions.filter(t => t.type === 'VENTA')}
                clients={clients}
                products={products}
                onOpenNewNote={(initialData) => {
                  if (clients.length === 0) {
                    alert('Para emitir una Nota de Credito o Debito, primero registre al menos un Cliente.');
                    return;
                  }
                  setModalState({ isOpen: true, type: 'newCreditDebitNote', data: initialData || null });
                }}
                onViewVoucher={(tx) => setPrintDoc(tx)}
              />
            )}

            {activeTab === 'entities' && (
              <EntitiesView 
                suppliers={suppliers}
                clients={clients}
                onOpenModal={(type, data) => setModalState({ isOpen: true, type, data })}
                onDeleteSupplier={(id) => {
                  if (confirm('Eliminar proveedor?')) {
                    setSuppliers(prev => prev.filter(s => s.id !== id));
                    showToast('Proveedor eliminado.');
                  }
                }}
                onDeleteClient={(id) => {
                  if (confirm('Eliminar cliente?')) {
                    setClients(prev => prev.filter(c => c.id !== id));
                    showToast('Cliente eliminado.');
                  }
                }}
              />
            )}

            {activeTab === 'audit' && (
              <AuditView 
                transactions={transactions}
                onViewVoucher={(tx) => setPrintDoc(tx)}
                onExportExcel={handleExportExcel}
              />
            )}
          </main>

          {/* FOOTER */}
          <footer className="bg-slate-900 text-slate-400 text-xs py-4 border-t border-slate-800 mt-auto">

                <span>•</span>
                <span>Sistema Interno de Gestion de Stock, Produccion y Facturacion</span>
              </div>

                <button onClick={handleClearAllData} className="hover:text-rose-400 underline transition">
                  Vaciar Base de Datos
                </button>
              </div>
            </div>
          </footer>

          {/* MODALS */}
          {modalState.isOpen && (
            <div 
              className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4"
              onClick={() => setModalState({ isOpen: false, type: null, data: null })}
            >
              <div 
                className="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto animate-fade-in border border-slate-200"
                onClick={(e) => e.stopPropagation()}
              >
                
                {(modalState.type === 'newRawMaterial' || modalState.type === 'editRawMaterial' || modalState.type === 'duplicateRawMaterial') && (
                  <RawMaterialFormModal 
                    isEdit={modalState.type === 'editRawMaterial'}
                    isDuplicate={modalState.type === 'duplicateRawMaterial'}
                    initialData={modalState.data}
                    suppliers={suppliers}
                    onSave={handleSaveRawMaterial}
                    onClose={() => setModalState({ isOpen: false, type: null, data: null })}
                  />
                )}

                {(modalState.type === 'newProduct' || modalState.type === 'editProduct' || modalState.type === 'duplicateProduct') && (
                  <ProductFormModal 
                    isEdit={modalState.type === 'editProduct'}
                    isDuplicate={modalState.type === 'duplicateProduct'}
                    initialData={modalState.data}
                    rawMaterials={rawMaterials}
                    suppliers={suppliers}
                    onSave={handleSaveProduct}
                    onClose={() => setModalState({ isOpen: false, type: null, data: null })}
                  />
                )}

                {(modalState.type === 'newSupplier' || modalState.type === 'editSupplier') && (
                  <SupplierFormModal 
                    isEdit={modalState.type === 'editSupplier'}
                    initialData={modalState.data}
                    onSave={handleSaveSupplier}
                    onClose={() => setModalState({ isOpen: false, type: null, data: null })}
                  />
                )}

                {(modalState.type === 'newClient' || modalState.type === 'editClient') && (
                  <ClientFormModal 
                    isEdit={modalState.type === 'editClient'}
                    initialData={modalState.data}
                    onSave={handleSaveClient}
                    onClose={() => setModalState({ isOpen: false, type: null, data: null })}
                  />
                )}

                {modalState.type === 'newPurchase' && (
                  <PurchaseFormModal 
                    suppliers={suppliers}
                    rawMaterials={rawMaterials}
                    onSave={handleRegisterPurchase}
                    onClose={() => setModalState({ isOpen: false, type: null, data: null })}
                  />
                )}

                {modalState.type === 'newProduction' && (
                  <ProductionFormModal 
                    initialData={modalState.data}
                    products={products}
                    rawMaterials={rawMaterials}
                    suppliers={suppliers}
                    onSave={handleRegisterProduction}
                    onClose={() => setModalState({ isOpen: false, type: null, data: null })}
                  />
                )}

                {modalState.type === 'newSale' && (
                  <SaleFormModal 
                    clients={clients}
                    products={products}
                    transactions={transactions}
                    onSave={handleRegisterSale}
                    onClose={() => setModalState({ isOpen: false, type: null, data: null })}
                  />
                )}

                {modalState.type === 'newCreditDebitNote' && (
                  <CreditDebitNoteModal 
                    initialData={modalState.data}
                    clients={clients}
                    products={products}
                    allSales={transactions.filter(t => t.type === 'VENTA')}
                    transactions={transactions}
                    onSave={handleRegisterCreditDebitNote}
                    onClose={() => setModalState({ isOpen: false, type: null, data: null })}
                  />
                )}

                {modalState.type === 'quickStockAdjust' && (
                  <QuickStockAdjustModal 
                    data={modalState.data}
                    onSave={handleQuickAdjust}
                    onClose={() => setModalState({ isOpen: false, type: null, data: null })}
                  />
                )}

                {modalState.type === 'backupRestore' && (
                  <BackupRestoreModal 
                    onExportJSON={handleExportJSON}
                    onImportJSON={handleImportJSON}
                    onClose={() => setModalState({ isOpen: false, type: null, data: null })}
                  />
                )}

              </div>
            </div>
          )}

          {/* VOUCHER & INVOICE PRINT MODAL */}
          {printDoc && (
            <VoucherPrintModal 
              doc={printDoc}
              onClose={() => setPrintDoc(null)}
            />
          )}

        </div>
      );
    }

    // -----------------------------
    // 1. DASHBOARD VIEW
    // -----------------------------
    function DashboardView({ metrics, rawMaterials, products, transactions, suppliers, clients, onOpenModal, onNavigateTab }) {
      const chartCanvasRef = useRef(null);
      const chartInstanceRef = useRef(null);

      useEffect(() => {
        if (!chartCanvasRef.current || typeof Chart === 'undefined') return;

        if (chartInstanceRef.current) {
          chartInstanceRef.current.destroy();
        }

        const ctx = chartCanvasRef.current.getContext('2d');
        const hasValuation = metrics.totalInventoryValuation > 0;

        chartInstanceRef.current = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: hasValuation ? ['Materias Primas ($)', 'Mercaderias en Deposito ($)'] : ['Sin Stock'],
            datasets: [{
              data: hasValuation ? [metrics.rawValuation, metrics.productsCostValuation] : [1],
              backgroundColor: hasValuation ? ['#059669', '#d97706'] : ['#e2e8f0'],
              hoverOffset: 4,
              borderWidth: 0
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: 'bottom',
                labels: {
                  boxWidth: 12,
                  font: { family: "'Plus Jakarta Sans', sans-serif", size: 11 }
                }
              },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    if (!hasValuation) return ' 0 %';
                    return ' ' + context.label + ': ' + formatCurrency(context.raw);
                  }
                }
              }
            },
            cutout: '70%'
          }
        });

        return () => {
          if (chartInstanceRef.current) {
            chartInstanceRef.current.destroy();
          }
        };
      }, [metrics]);

      return (
        <div className="space-y-6 animate-fade-in">
          
          {/* HERO BANNER */}
          <div className="bg-gradient-to-r from-emerald-900 via-emerald-800 to-teal-900 text-white rounded-2xl p-6 shadow-xl relative overflow-hidden">
            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 relative z-10">
              <div>
                <div className="inline-flex items-center gap-2 bg-emerald-700/60 px-2.5 py-1 rounded-full text-xs font-semibold text-emerald-200 mb-2">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  Planta y Almacen Operativo
                </div>
                <h1 className="text-2xl sm:text-3xl font-extrabold tracking-tight">Panel de Control General</h1>
                <p className="text-emerald-200 text-sm mt-1 max-w-2xl">
                  Monitoreo contable del flujo de materias primas (+Compras / -Produccion) y mercaderias terminadas (+Produccion / -Ventas).
                </p>
              </div>
              
              <div className="bg-emerald-950/60 border border-emerald-700/50 rounded-xl p-4 text-right backdrop-blur-sm">
                <span className="text-xs text-emerald-300 font-medium uppercase tracking-wider block">Valuacion Total de Almacen</span>
                <span className="text-2xl sm:text-3xl font-black text-white font-mono-code">{formatCurrency(metrics.totalInventoryValuation)}</span>
                <div className="text-[11px] text-emerald-300 mt-0.5">Valuado al costo de reposicion</div>
              </div>
            </div>
          </div>

          {/* 4 CORE KPI CARDS */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            
            <div className="bg-white rounded-xl p-5 border border-slate-200 shadow-sm hover:shadow-md transition">
              <div className="flex justify-between items-start">
                <div>
                  <span className="text-xs font-bold text-slate-500 uppercase tracking-wider">Materias Primas</span>
                  <h3 className="text-xl font-bold text-emerald-800 mt-1 font-mono-code">{formatCurrency(metrics.rawValuation)}</h3>
                </div>
                <div className="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center text-lg">
                  <i className="fas fa-wheat-awn"></i>
                </div>
              </div>
              <div className="mt-4 flex items-center justify-between text-xs text-slate-600 border-t border-slate-100 pt-3">
                <span>{metrics.totalRawItems} Items registrados</span>
                <button onClick={() => onNavigateTab('rawMaterials')} className="text-emerald-600 hover:text-emerald-800 font-semibold flex items-center gap-1">
                  Ver catalogo <i className="fas fa-arrow-right text-[10px]"></i>
                </button>
              </div>
            </div>

            <div className="bg-white rounded-xl p-5 border border-slate-200 shadow-sm hover:shadow-md transition">
              <div className="flex justify-between items-start">
                <div>
                  <span className="text-xs font-bold text-slate-500 uppercase tracking-wider">Mercaderias (Costo)</span>
                  <h3 className="text-xl font-bold text-amber-800 mt-1 font-mono-code">{formatCurrency(metrics.productsCostValuation)}</h3>
                </div>
                <div className="w-10 h-10 rounded-xl bg-amber-100 text-amber-700 flex items-center justify-center text-lg">
                  <i className="fas fa-boxes-stacked"></i>
                </div>
              </div>
              <div className="mt-4 flex items-center justify-between text-xs text-slate-600 border-t border-slate-100 pt-3">
                <span>Valor Venta: {formatCurrency(metrics.productsSaleValuation)}</span>
                <button onClick={() => onNavigateTab('products')} className="text-amber-600 hover:text-amber-800 font-semibold flex items-center gap-1">
                  Ver recetas <i className="fas fa-arrow-right text-[10px]"></i>
                </button>
              </div>
            </div>

            <div className="bg-white rounded-xl p-5 border border-slate-200 shadow-sm hover:shadow-md transition">
              <div className="flex justify-between items-start">
                <div>
                  <span className="text-xs font-bold text-slate-500 uppercase tracking-wider">Ventas Facturadas</span>
                  <h3 className="text-xl font-bold text-sky-700 mt-1 font-mono-code">{formatCurrency(metrics.totalSales)}</h3>
                </div>
                <div className="w-10 h-10 rounded-xl bg-sky-100 text-sky-700 flex items-center justify-center text-lg">
                  <i className="fas fa-file-invoice-dollar"></i>

              <div className="mt-4 flex items-center justify-between text-xs text-slate-600 border-t border-slate-100 pt-3">
                <span>{transactions.filter(t => t.type === 'VENTA').length} Facturas emitidas</span>

                </button>
              </div>
            </div>

            <div className="bg-white rounded-xl p-5 border border-slate-200 shadow-sm hover:shadow-md transition">
              <div className="flex justify-between items-start">
                <div>
                  <span className="text-xs font-bold text-slate-500 uppercase tracking-wider">Compras Insumos</span>
                  <h3 className="text-xl font-bold text-indigo-700 mt-1 font-mono-code">{formatCurrency(metrics.totalPurchases)}</h3>
                </div>
                <div className="w-10 h-10 rounded-xl bg-indigo-100 text-indigo-700 flex items-center justify-center text-lg">
                  <i className="fas fa-truck-ramp-box"></i>
                </div>
              </div>
              <div className="mt-4 flex items-center justify-between text-xs text-slate-600 border-t border-slate-100 pt-3">
                <span>{transactions.filter(t => t.type === 'COMPRA').length} Ordenes de compra</span>
                <button onClick={() => onNavigateTab('purchases')} className="text-indigo-600 hover:text-indigo-800 font-semibold flex items-center gap-1">
                  Ver compras <i className="fas fa-arrow-right text-[10px]"></i>
                </button>
              </div>
            </div>

          </div>

          {/* CRITICAL STOCK ALERTS */}
          {(metrics.lowStockRawMaterials.length > 0 || metrics.lowStockProducts.length > 0) && (
            <div className="bg-rose-50 border border-rose-200 rounded-2xl p-5 shadow-sm">
              <div className="flex items-center gap-3 text-rose-800 font-bold mb-3">
                <i className="fas fa-triangle-exclamation text-lg"></i>
                <span>Alertas de Punto de Reposicion (Stock Critico)</span>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                
                {metrics.lowStockRawMaterials.length > 0 && (
                  <div className="bg-white p-4 rounded-xl border border-rose-200 shadow-xs">
                    <span className="text-xs font-bold text-rose-700 uppercase block mb-2">Materias Primas a Reponer con Proveedor:</span>
                    <ul className="space-y-2 text-xs">
                      {metrics.lowStockRawMaterials.map(rm => (
                        <li key={rm.id} className="flex justify-between items-center bg-rose-50/50 p-2 rounded-lg border border-rose-100">
                          <div>
                            <span className="font-semibold text-slate-800">{rm.name}</span>
                            <span className="text-slate-500 block text-[11px]">Minimo req: {rm.minStock} {rm.unit}</span>
                          </div>
                          <div className="text-right">
                            <span className="font-bold text-rose-700 font-mono-code">{formatNumber(rm.currentStock)} {rm.unit}</span>
                            <button 
                              onClick={() => onOpenModal('newPurchase', { preselectedRmId: rm.id })}
                              className="block text-[10px] text-emerald-700 hover:underline font-semibold mt-0.5"
                            >
                              + Comprar
                            </button>
                          </div>
                        </li>
                      ))}
                    </ul>
                  </div>
                )}

                {metrics.lowStockProducts.length > 0 && (
                  <div className="bg-white p-4 rounded-xl border border-rose-200 shadow-xs">
                    <span className="text-xs font-bold text-amber-700 uppercase block mb-2">Mercaderias Terminadas con Stock Bajo:</span>
                    <ul className="space-y-2 text-xs">
                      {metrics.lowStockProducts.map(p => (
                        <li key={p.id} className="flex justify-between items-center bg-amber-50/50 p-2 rounded-lg border border-amber-100">
                          <div>
                            <span className="font-semibold text-slate-800">{p.name}</span>
                            <span className="text-slate-500 block text-[11px]">Minimo req: {p.minStock} u</span>
